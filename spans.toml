# THE THREE THAT ALREADY REBUILD BYTE-IDENTICAL, and they are here as a CHECK
# ON THIS FILE rather than as work. artefact.py holds all three at R7 -- NEUR0,
# NEUR9 and TPSYCHO reproduce their originals exactly -- so the coverage walk
# has a KNOWN ANSWER for them, and anything below 100% is a defect in these
# segment lists or in spans.py, never in the reconstruction. Nothing else in
# this file can be checked that way, which is the whole reason they are here.
#
# SEGMENT 0x1000 IS INCLUDED FOR THESE and excluded for parts 001-007. That is
# not an inconsistency. For a part, 0x1000 is the program block and a HARNESS
# supplies its own, so it can never match by construction; these three are not
# harnesses -- each rebuilds the whole program -- so their main belongs in the
# walk like any other segment.
#
# NEUROSIS.008 IS ABSENT AND CANNOT BE ADDED HERE. It is DemoVT, third-party,
# and this repository holds no reconstruction of it -- run/ORIG8.EXE is a copy
# of the original, not a rebuild. Its byte-exact rebuild is a different repo's
# job. A row here could only ever measure the original against itself.

# THE WALK IS SMALL HERE, AND THAT IS CORRECT. This part is almost entirely
# program: its program segment is 6,864 bytes and the two unit segments below
# are 1,632. Until 3 Sep 2026 that program segment was listed in `segments`,
# so the walk reported 8,496 of 8,496 -- and 81% of that was a region
# progseg.py already measures byte-for-byte, in its own denominator. Two
# instruments measuring one region is fine; two DENOMINATORS holding it is a
# double count, and the walk was the wrong one to hold it because the program
# segment emits no unit.
[part."000"]
exe  = "NEUROSIS.000"
# The compiler names its map after the SOURCE, so it keeps the built name.
map      = "build/BIN/NEUR0.MAP"
end_at   = 0x1213
dgroup_at = 0x12ed
segments = [
  { segment = 0x11ad, name = "DETECT" },
  { segment = 0x11b1, name = "CRT" }
]

# Small walk, same reason as part 000: 1,568 bytes of unit segments, and a
# 112-byte program segment that progseg.py measures instead. The number was
# 1,680 until the program segment left this list.
[part."009"]
exe  = "NEUROSIS.009"
map      = "build/BIN/NEUR9.MAP"
end_at   = 0x1069
dgroup_at = 0x10c3
segments = [
  { segment = 0x1007, name = "CRT" }
]

# The smallest walk of the ten: 224 bytes, plus a 176-byte program segment
# that progseg.py measures. It read 400 until 3 Sep 2026. Nothing stopped
# being measured -- one instrument stopped counting another one's bytes.
[part."psycho"]
exe  = "PSYCHO.EXE"
map      = "build/BIN/TPSYCHO.MAP"
end_at   = 0x1019
dgroup_at = 0x106d
segments = [
  { segment = 0x100b, name = "DOS" }
]
