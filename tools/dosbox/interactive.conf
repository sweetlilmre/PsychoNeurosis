# DOSBox-X configuration for working INTERACTIVELY -- drops you at a DOS
# prompt with everything mounted, rather than building and exiting.
#
#     D:\DOSBox-X\dosbox-x.exe -conf tools\dosbox\interactive.conf
#
# Drives:
#     C:  the Turbo Pascal 7.01 install   (C:\TP\BIN on the PATH)
#     D:  build/   -- the compiled output
#     E:  run/     -- a writable copy of the original demo
#
# The original writes NEUROSIS.CFG next to itself, which is why E: points at a
# COPY and not at bin/. bin/ holds the 1994 files and stays untouched.
#
# CPU settings are period-appropriate here, unlike psycho.conf which only has
# to compile: a 486 at 20000 cycles is roughly what this was written for.
# Press Ctrl-F11 / Ctrl-F12 to slow down or speed up if the timing looks wrong.

[sdl]
autolock = false

[dosbox]
machine  = svga_s3
memsize  = 16
captures = capture
title    = psycho

[cpu]
core    = normal
cputype = 486_prefetch
cycles  = 20000

[mixer]
rate     = 44100
blocksize = 1024

[sblaster]
sbtype = sb16
sbbase = 220
irq    = 7
dma    = 1

[dos]
xms = true
ems = true
umb = true
lfn = false
minimum mcb free=1

[autoexec]
mount C D:\DOSBox-X\Machine\HDD
mount D D:\source\psycho\build
mount E D:\source\psycho\run
set PATH=%PATH%;C:\TP\BIN
E:
echo.
echo   C: Turbo Pascal 7.01      D: build output      E: the demo
echo.
echo   PSYCHO      run the original
echo   TPC file    compile something by hand
echo.
