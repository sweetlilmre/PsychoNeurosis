resolution = "IT IS TWO SEPARATE THINGS, AND ONE OF THEM IS THE MEASURING APPARATUS. 89.0 to 89.1 percent. InitTables settled the sizes that were in doubt: 1015:0662 loops while [BP-2] != $31F, so YOffset really is 800 entries, and 1015:06a7 tests $27F, so PlaneOf really is 640. Both were already right. PlaneOf's base is $A55E and 640 bytes later is $A7DE, which IS PanX -- so there is NO missing gap before PanX, and that half of the puzzle is closed by refutation. The same routine did yield a defect: the plane counter is a BYTE at [BP-3], not a Word. 1015:0685 reads it MOV AL / XOR AH,AH / MOV DX,AX before the shift count reaches CX, and 1015:069a..06a3 increments, compares and resets it with INC BYTE PTR / CMP BYTE PTR / MOV BYTE PTR. A Word loads straight into CX and costs three instructions less, which is what ours did. Worth 26 bytes. THE REMAINING -2 IS THE HARNESS. Our YOffset base is $9F1C against the original's $9F1E. Typed constants end at $9F19 in both; ours then carries 0D 0A at $9F1A where the original has 00 00, because the original writes no text. The uninitialised region begins where the initialised one ENDS, not where its paragraph padding ends, so those two bytes move every variable in the part. Part 006 proves it independently: +2 is the ONLY shift dsmap reports there and the same two bytes are its only image difference. NOT FIXABLE BY WRITING DIFFERENTLY -- replacing every WriteLn(s) with Write(s, #13, #10) leaves the same two bytes at the same address, measured. Recorded in docs/23-deviations.md and corrected in dgimage.py's docstring, which had claimed for weeks that these bytes displace nothing. WHAT IS STILL OWED HERE: the original has FOUR bytes of variables between the end of its typed constants at $9F1A and YOffset at $9F1E, and we have none. Whose they are is unknown. Net of the harness's +2 that is the -2 still reported. Find the owner before declaring anything: an addition in the wrong unit cost 569 bytes twice."

