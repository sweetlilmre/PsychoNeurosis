[[plan.investigation]]
name = "bss-sweep-all-parts"
finding = "THE BSS SWEEP ACROSS ALL NINE PARTS, in one struct read each and no disassembler, and it is the worklist for the 99% target. The MZ header's minalloc field is the loader's uninitialised-data request in paragraphs; the difference from the original's is the exact shortfall. Ours against theirs: 004 is 2,768 bytes SHORT -- the largest. 002 is 2,096 short. 005 is 384 bytes OVER, the only surplus. 003 is 128 short. 006 is 48 short. And 000, 001, 007 and 009 are EXACT. PART 001'S IS NOW EXACT, which is the headline: it was 16,704 bytes short at the start of the day and matches to the paragraph. AND PART 002 IS THE INSTRUCTIVE ONE: it is 2,096 bytes short of data and its coverage walk reads 99.9%. So a data shortfall does NOT necessarily show up in the code walk -- that part's code evidently makes few absolute data references, or the ones it makes fall inside the walk's short-difference tolerance. The two instruments measure different things and neither implies the other. Do not read a high walk percentage as evidence the data is right, and do not expect fixing the data to move the walk by itself; on part 001 a 16.7KB correction moved it three bytes. WHERE 004's 2,768 BYTES ARE, localised but not yet identified. dsgaps over PART4_LEMMINGS.PAS shows EVERY sprite bank tiling exactly against its declaration -- WalkBank 432, SplatBank 480, DigBank 1,326, TunnelBk 420, DeathBBk 800, DeathABk 648, BuildBank 720 -- with ONE exception: TumbleBk is declared array[1..4] of array[0..99], which is 400 bytes, and the gap from $06D2 to SplatBank at $12B8 is 3,046. So 2,646 bytes are unaccounted between them, which is most of the shortfall. There IS something in that gap: segment 1005 references $1240, which is 120 bytes below SplatBank, and nothing else in the range. So the region reads as TumbleBk, then a large undeclared block, then a 120-byte block at $1240, then SplatBank. Read what 1005 does with $1240 first -- and note 3,046 does not divide by 4, so TumbleBk simply being bigger does not explain it."
