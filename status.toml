resolution = "THE INITIALISED IMAGE NOW MATCHES IN SIZE EXACTLY -- 752 bytes against 752 -- with TWENTY-FIVE bytes differing, down from 391 differing and 112 short. The initialised region's data-reference shift is +0 across thirteen sites at $0002..$0282, so that whole region is now correct. AND THE TWO 112s WERE A COINCIDENCE, which is why the finding said to check before declaring anything. The initialised shortfall was 112 bytes and the BSS shortfall is 112 bytes and they are unrelated: everything added here is INITIALISED data, the image grew by 112, and minalloc did not move at all. Acting on the coincidence would have produced a 112-byte surplus in the uninitialised region while leaving the real one open. TWO CAUSES, both found by reading the image side by side rather than by arithmetic. FIRST, FOUR BYTES: P1S4's MScale was a `var` and its address is $0018, which is INSIDE the initialised region -- so it is a TYPED CONSTANT, four bytes of zero written at run time by Demo_Scene4. A plain var reserves space in the uninitialised region instead, and its absence shifted every initialised byte after $0018 down by four. Scene 5's copy of the same variable, same name and same purpose, IS a var, because its address is $AABE, well past the end. Only the addresses distinguish the two storage classes. SECOND, 108 BYTES: a THIRD vector table nothing reads. $001C plus VecLogoA's 288 bytes is $013C, and the globe is read from $01A8 (12c5:08b3 is PUSH WORD PTR [DI+$1A8]), so the 108 bytes between them are a table the run-time code never touches. Decoded, they are eighteen points of a radius-50 circle in the YZ plane at twenty-degree steps -- one of the globe's three rings, emitted on its own. It is now generated from the binary by tools/emit_pascal_data2.py rather than transcribed, and IT SURVIVED THE SMART LINKER, which was the risk: an unreferenced typed constant has been dropped on this target before, and this one is kept because the unit's other constants are referenced. MEASURED ACROSS THE TARGET: all parts unchanged, three byte-exact artefacts still holding, traps identical opcode for opcode. The dominant data shifts halved again, from -232 and -212 to -124 and -104."

