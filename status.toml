[plan.row."001 12c5:0a89"]
label = "Demo_Scene5 preamble"
investigation = "part1-s4s5-palette"
note = "Scene5 in the binary flushes keys, does ClearScreen($A000,0), then AllocWork (12c5:0a60: GetMem+clear of the work buffer), THEN Load rewrites the DAC -- so the palette swap happens over black. Ours went straight into Load, recolouring scene 4's still-displayed frame for the whole file read and backdrop build. Scene5 rebuilt to the binary's structure (also: palette is a Load local passed to VGA.SetPalette768, FreeMem(Work) on exit, and P1S5 needs $G+). Opcode-identical modulo fixups after the fix."

[plan.row."002 108b:0e03"]
label = "$G-/$N- codegen vs the binary's"
investigation = "pacing"
note = "Every framed routine in every original segment opens ENTER -- a 286 instruction TP7 only emits under $G+ -- yet eight of our scene units compiled under the $G- default (P1S1/S2/S3, P2S2, PART3_TUNNEL, PART3_STARS, P5S3, P6S1), so the compiler multiplied with MUL and doubled shifts in exactly the per-frame 3-D and fixed-point Pascal (Obj_Transform 108b:0e03 is the archetype). Likewise x87 originals compiled under $N-: P1S5's PER-FRAME translate trig (12c5:07b9) ran on the software six-byte-Real RTL. $G+ added to the eight (evidence cited per unit), $N+ to P1S1/P1S3/P1S4/P1S5/PART3_BLOCKS. DETECT stays $G- -- its byte-identical R7 artefact proves the original was. Awaiting a run to measure the remaining gap."

[plan.row."003 120f:0017"]
label = "Waves_LoadCurves palette"
investigation = "part3-s6-left-dark"
note = "The TRUE cause: LoadCurves builds the scene's own palette after the BlockRead -- a blue triangle over colours 1..178 peaking at 89 (Round(I*0.4)+27 rising, Round((178-I)*0.4)+27 falling, x87, extended 0.4 at CS:000D). The reconstruction ended at the Close, inheriting scene 5's monotone ramp, under which low phases (the left half) rendered dark: measured median blue 84 left / 108 right vs the original's uniform ~107. Palette loops added; also {$I-} (no IOCheck in the original) and F as the DGROUP global at DS:D20C. Fixed and confirmed against ORIG3 by pe. The earlier row's stray-store finding stands but was NOT the cause of this defect."

[plan.row."003 120f:00fe"]
label = "Waves_Step erase/draw BASM"
investigation = "part3-s6-left-dark"
note = "Erase/draw is hand BASM with ES/CX set only in the erase branch; a skipped erase makes the draw store the colour byte into the curve table at 356+NewX (back half of curve 0). Original's left-half brightness is that corruption plus unerased litter; our Pascal-isation had fixed the bug. Block now transcribed verbatim, fragment target @asm 003 120f:01b1 +59 StepEraseDraw."

[plan.row."005 1096:051a"]
label = "Scene2 motion-table build"
investigation = "part5-386-trio"
note = "The investigation's premise is stale: the 386 trio (SinCos/RotatePoint/Project) HAS been transcribed since the 19 Aug part-005 re-read (P5S3, verified fragments). The real cost was the motion-table build at 1096:051a: x87 code in the original (FILD / FDIV single 180.0 / FLD extended Pi / RTL Sin-Cos-Round), but P5S2 compiled under the $N- default, sending 3,424 trig calls through the software six-byte-Real RTL -- the multi-second black-screen pause. Fix: {$N+} on P5S2; the build now emits x87 (FLD extended + FMULP present). Awaiting a run to confirm the pause is gone."
