[[plan.investigation]]
name = "part5-registers-held"
finding = "AND ONE THING IN P5S3 THAT NO PASCAL SPELLING HAS PRODUCED. 1102:0079 computes CX + Col - Half into AX and then compares AX TWICE -- CMP AX,$13F / JG and CMP AX,0 / JL -- with no store anywhere; 1102:008c does the same into BX for the row; and 1102:00a0 then uses BOTH registers for the address, ADD BX,BX / MOV DI,[BX-$55F6] / ADD DI,AX. So two values are computed once each and held in registers across four comparisons and an address computation. OURS STORES THEM. Declaring SX and SY gives MOV [BP-$13],AX and then CMP [BP-$13],$13F -- Turbo Pascal has no peephole that keeps the accumulator, which our own build proves, and writing the expression out twice instead would evaluate it twice. Neither spelling is the original's. That is 41 bytes at 1102:0082 and it is the only thing in part 005 that is not understood; the frame around it is now exact. Worth a probe rather than another guess -- and worth checking whether it is the same phenomenon as the register-allocation difference part 006 records at 100f:0543, where the original builds an index in DI and ours goes through AX."
