[plan.row."001 12c5:075e"]
label = "Vector_Animate frame"
investigation = "pacing"
note = "The part's second-largest span, and the frame technique found it the same way it found BuildLens. Vector_Animate opens ENTER $08 at 12c5:075e and the reconstruction declared two Integers, which is four bytes; worse, every local in the original sits on an ODD offset -- [BP-3] and [BP-7] -- which only happens if a ONE-BYTE local was declared FIRST and pushed everything after it out of alignment. Turbo Pascal does not align locals, so the offsets recover the declaration order directly: [BP-1] a byte written 0 at 12c5:076c and NEVER READ (one reference in the whole routine, and it is that store -- it reads like an exit flag the author abandoned, since Exit is reached straight from the KeyPressed test at 12c5:0851); [BP-3] Frame, seeded at 12c5:0770 and tested against $F0 at 12c5:085c; [BP-5] NEVER REFERENCED AT ALL at any width; [BP-7] Local, seeded at 12c5:0769, read at 12c5:07b9 and 12c5:0806, advanced by 3 at 12c5:082b. Seven bytes declared and ENTER $08 because the frame rounds to even. Both dead locals are transcribed anyway -- they are what the 1994 source declared, and omitting them is what put every other local in the routine at the wrong offset. Boolean, Byte and Char are indistinguishable from MOV BYTE PTR [BP-1],0, so the choice of Boolean is a guess and is flagged as one in the source. Measured: the span shrinks from 12c5:076e..0a13 (677) to 12c5:0780..0a13 (659), so the prologue and all three seeds now align, and part 001 moves 68.4% to 68.5%. THE 659 BYTES THAT REMAIN ARE THE LOOP BODY and are not yet read -- CopyScreen, ObjTransformAll, RenderObject, the three Round(Sin/Cos) translations at 12c5:07b8..0828 and ObjTranslate. That is where the rest of this span's work is."

