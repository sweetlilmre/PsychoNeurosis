[[plan.investigation]]
name = "part1-buildcell-asm"
finding = "part 001: BuildCell at 1012:0366 is HAND-WRITTEN ASSEMBLER and ours is Pascal, which is why its frame matches and its body does not -- the frame was corrected earlier and the walk did not move. Two tells settle it: 1012:037a is MOV WORD PTR [BP-2],$4FD6, loading a DATA ADDRESS as an immediate into a local, and 1012:039e is ADD BYTE PTR [BP-7],0, a literal no-op add. A compiler emits neither. It also walks BACKWARDS -- MOV CX,$640 then DEC CX -- which this file's own comment already says. IDENTIFIED: $4FD6 is Cell and $4304 is LensTab, and the file's own arithmetic confirms it ($4FD6 - $4304 = $0CD2 = 1641 words, so Cell begins where the table ends). The loop reads LensTab[cx] as a gather index, fetches a source byte, adds a bias byte held at [BP-7], and stores to Cell[cx]. THE ONE THING NOT IDENTIFIED, and it blocks a verbatim transcription: the source base is 1012:036a's IMUL DI,[BP+4],$669 then LEA AX,[DI-$37F] -- N * 1641 - 895 -- used as a DS-RELATIVE offset. For N = 1 that is 746, a low DS offset well below LensTab at $4304, and nothing in this unit is recorded there. Ours reads the saved background through `Under`, a HEAP pointer, which cannot be what a DS-relative read addresses. Find what lives at DS:$02EA before writing the asm: a wrong verbatim transcription is worse than the Pascal it replaces, because it looks authoritative."
