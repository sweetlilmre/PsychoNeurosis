[[plan.investigation]]
name = "part5-codegen-two"
finding = "PART 005's LAST 136 BYTES ARE TWO CODE-GENERATION PUZZLES AND NOTHING ELSE. The layout is exact and the frames are right; what is left is where Turbo Pascal put things. FIRST, AND IT IS BEHAVIOURAL RATHER THAN COSMETIC: the interpolation multiplies UNSIGNED in ours and SIGNED in the original. 1096:0331 is CWD / IMUL WORD PTR [BP-$1B] / IDIV; ours is MUL WORD PTR [BP-$1B] / CWD / IDIV. Same four bytes, different meaning -- and OURS IS ARGUABLY WRONG, because MUL leaves a 32-bit product in DX:AX and the CWD that follows OVERWRITES DX with the sign of AX, throwing the high half away before the divide reads it. Every variable involved is declared Integer, so a signed IMUL is what should be emitted and is not. Four sites, in the erase pass and the draw pass of the dot loop. This one is worth a probe: what makes TP7 choose MUL over IMUL when both operands are Integer? SECOND, at 1102:0079 and 1102:0224: the original computes a value into AX and compares AX TWICE with no store, does the same into BX, and then uses BOTH registers for an address. Ours stores each into a frame slot and reloads. Turbo Pascal has no peephole that keeps the accumulator -- our own build proves it -- and writing the expression out twice would evaluate it twice. Neither spelling is the original's. 68 bytes across the two. IT MAY BE THE SAME PHENOMENON AS PART 006's 100f:0543, where the original builds a palette index in DI and ours goes through AX, and as part 005's own MUL/IMUL choice: all three are the compiler deciding differently about registers and signedness on source that looks identical. Worth ONE probe covering all of them rather than three separate guesses."
