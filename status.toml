resolution = "The left half was dark because Waves_LoadCurves' own palette was missing: the routine does not stop at the curve BlockRead -- it lays a blue TRIANGLE ramp over colours 1..178, brightest mid-phase, so both ends of every curve are dim and no half of the shape is darker than the other. The reconstruction had inherited the previous scene's monotone ramp instead. Two secondary recoveries from the same investigation: the erase/draw BASM block is back verbatim with the original's stray-store bug (row 003 120f:00fe -- real, but not this defect's cause), and the fpu variants proved to be post-build patches of the CD 3x emulator interrupts, so the build keeps $E+. Fix confirmed by pe against ORIG3 side by side on 22 Aug 2026; the part-tier rung moves when TPART3 is re-observed through observe.py."

