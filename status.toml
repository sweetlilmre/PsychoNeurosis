resolution = "THE FIRE'S RESEED HAD TWO DEFECTS AND THEY COMPOUND. 95.6 to 96.2 percent, and the reseed block's opcodes are now identical. Found from the bytes AFTER the run said where to look, which is the order that worked. ONE: the test is `<`, not `>`. Over the same FCOMPP the original emits JBE at 1118:0922 where ours emitted JAE -- opposite senses. TWO, AND THIS IS THE ONE THAT LOWERS THE FIRE: THE STORE IS UNCONDITIONAL. 1118:0932 is the conditional jump's OWN TARGET, and it reads the value back out of [BP-$04] and writes it to Grid[99,I] on EVERY column. Only the VALUE is conditional, so the seed is STICKY: the bottom row is written all the way across every frame, carrying the last drawn value into the columns the test skips. Ours wrote only where the test fired and left the rest at whatever the diffusion had cooled them to -- a cooler bottom row, and a shorter fire. The slot was already declared as Tmp and sitting unused, with a note saying [BP-$04] is touched twice. It is never initialised before the loop, so the first columns of the first frame carry whatever the frame held; that is the original's behaviour and it is transcribed rather than corrected. The residual differences in the block are all addresses -- the RTL's Random target, the 0.4 constant's CS offset, Grid's DS displacement (2 bytes, part of the var-layout thread) and the FPU status slot one byte low, which means this routine's frame is still one byte too big before the compiler's temporary. SCENE 1'S JERKINESS IS NOT ADDRESSED and no cause is proposed -- it needs its own look. AND THIS FIX WANTS ANOTHER WATCHED RUN: the fire should now climb as high as the original's, and nobody may record that but a person who sees it."

