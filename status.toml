resolution = "SEVEN FIXES IN ONE BATCH: part 001 86.7% -> 88.6%, +399 bytes, and no span is now larger than 135. Data image unchanged, traps identical opcode for opcode, checks clean. ONE IDIOM ACCOUNTED FOR MOST OF IT -- the record's address taken ONCE per iteration into a four-byte local, then every field written through it. It appeared in Vector_Run's two point loops, in StarInit, and in Transform, and in each case the reconstruction had three subscript computations instead. A four-byte frame slot written once and reloaded per field write is the signature; look for it before reading any loop body. 12c5:0780 VECTOR_ANIMATE, +132, AND IT CORRECTS A `NEVER REFERENCED` CLAIM OF MINE. The six bytes at $AACA were recorded as declared-and-unread with the type guessed as a Real. They are THREE INTEGERS and all three are written: the region is full of x87 traps, INT $3A..$3E carry their operands inline, and a plain disassembler resynchronises mid-trap and prints nonsense -- which is what `never referenced` was based on. The kit's x87 disassembler shows MOV [$AACA],AX, MOV [$AACC],AX and MOV [$AACE],AX after the three Round calls, and 12c5:0842 pushing all three to ObjTranslate. NEVER CALL A TRAP-CARRYING REGION UNREFERENCED WITHOUT DECODING IT FIRST. The order was wrong too: the original computes the three Rounds, THEN advances Local and OrbitAngle, THEN calls -- and both advances are the assignment form, not Inc. 1107:03d7 SORTOUTP, +63. DepthSort is NESTED inside a wrapper that takes the array by pointer -- 1107:03d7 is PUSH 1 / PUSH $90 / PUSH BP / CALL 0x287 and that PUSH BP is the STATIC LINK. Identical to scene 5's SortAll, in the same binary, which was worth 619. BuildBlobs takes the same pointer and the caller passes @Outp[1], which the folded ES:[DI-1] confirms as a one-based array. 1082:056f SCENE2, +75. Assign, Reset and Seek are in SCENE2's body and the call to Load comes after them, so Load is entered with the file already positioned. Ours opened the file inside Load. 1107:04bc TRANSFORM, +48. The translation is read through the POINTER PARAMETER as element zero, not from Trail[0] by name. Also measured and NOT acted on: the Outp stores go through the SAME base pointer at displacement $763, and $632F - $5BCC is exactly $763 -- so one pointer reaches both arrays, which means a containing record. The sizes do not divide cleanly (a 13-byte record cannot fill 1,891 bytes), so it is left open rather than forced. 12b2:0000 STARINIT, +92, the pointer idiom plus a Byte counter. AND THE STAR CODE IS WRITTEN ONCE, which is what the maintainer said it would be and which my first answer got the emphasis wrong on. Asked whether it was shared with part 2, I searched the other binaries for its bytes, found none, and reported `not shared` -- a true statement that invited the wrong conclusion, and one I had not earned, because a packed binary would have produced the same silence. Checking: only NEUROSIS_008 is packed and it is third-party, so the search was valid. But the useful measurement was a different one. Searching for the star-field SIGNATURE rather than its exact bytes -- Random(319) beside Random(199), MOV CX,$5A, the STOSB / ADD BX,9 tail -- and mapping every hit to a segment gives: MOV CX,$5A twice and both inside 12b2 (StarStep at 12b2:00c3 and StarDraw at 12b2:00fc), the STOSB tail once, and the Random pair at 1012:06b0, 12b2:0026, 12c5:04ce and 12c5:0500 -- the ones outside 12b2 being other scenes placing random points, not copies. So NOTHING IS DUPLICATED and the star code is a unit of its own. Part 006 carries a Random pair too and none of the drawing, so it has its own point placement rather than a copy of this. WHICH MEANS THE DEFECT IS STRUCTURAL AND ALREADY OPEN as part1-missing-star-unit: the original has these three routines in their own unit, reached by FAR calls -- 1107:0587 is LCALL 2b2:00f1 and a far call means a different unit -- and 12b2:0120 is an empty far routine, which is a unit initialisation section. Ours has them inlined in P1S4 where they are near-callable Pascal. Contrast the blitter at 1107:0199, which IS shared source with part 006 scene 2 and sits mid-segment for that reason."

