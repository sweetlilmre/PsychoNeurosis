resolution = "PART 005 IS AT 97.3% AND ITS DATA LAYOUT IS ESSENTIALLY DONE: minalloc matches the original EXACTLY, and dsmap's shift is +0 across ONE HUNDRED AND FORTY-FOUR sites spanning $0000..$ABAC. Four references remain off -- +32 over three sites at $63CA..$63D0 and +2 at $A5DC -- and those four are suspect as mispairings, because a real 32-byte surplus before $63CA would also show at $A67A, which reads +0. 96.7% -> 97.3%, +70 bytes on the walk. TWO UNREFERENCED BLOCKS, and the second needed a METHOD I had not used before. The first is 112 bytes at $5F6E between RowOfs and EdgeBuf: RowOfs's 200 words end there and EdgeBuf's recorded address is 112 further on, so the gap is read directly. THE SECOND COULD NOT BE READ THAT WAY. 98 bytes at $A55A, in a span that the addresses say is 128 wide, and NOTHING in part 005's seven segments references any address in it -- so there is no displacement to measure and no stride to factorise. What settled it was BISECTION ON THE SHIFT: declare a size, rebuild, read dsmap. 128 gave +30, 98 gave 0. That is a usable technique whenever a gap is unreferenced -- the shift is a continuous function of the size and one build prices each guess -- and it is cheaper than any amount of reading. AND THE 30 BYTES ARE NOT ACCOUNTED FOR, which is written into the source beside the declaration rather than smoothed over. The span is 128 and 98 balances the totals, so either Pal is longer than 768, or something 30 bytes wide sits between, or one address is a folded base. dsmap cannot pair Speed so its position is not checkable. The 98 is a total that balances, NOT a declaration that has been read, and the comment says so."

