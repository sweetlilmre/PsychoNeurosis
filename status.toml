[plan.row."002 1008:0362"]
label = "P2S1: a global file handle, unrolled plane writes, and inlined star loops"
investigation = "pacing"
note = "Part 002 92.6 to 95.4 percent. LoadFrames (1008:00b9): ENTER 80 is 128 bytes and no BP slot is touched, because the .DAT handle is a GLOBAL at DS:4A86 - 1008:00bd is MOV DI,4A86 / PUSH DS / PUSH DI for Assign, Reset, Seek, BlockRead and Close alike, where a local would be LEA DI,[BP-n] / PUSH SS / PUSH DI. The 128 bytes are declared and never read. And the four planes are written out LONGHAND with the literals 0, 1, 2 and 3, not looped: a for-loop needs a counter and the frame has no room for one. DoorLoop (1008:0362): ENTER 08 is the frame counter, FOUR BYTES NOBODY READS, and the star index; the star loops are INLINED, which is why the same 167-byte block recurs at 1008:039a, 0441, 04eb and 0592. Ghidra on the _fpu variant confirmed the whole routine including the unrolled plane writes and the 0x55 and 0x19 frame counts. Its remaining span is a re-anchoring artefact of length changes earlier, not a code difference: the phase-3 tail is instruction-for-instruction what the source emits."

[plan.row."002 1008:0607"]
label = "The door loops are FOR loops, and Scene2 has a global handle too"
investigation = "pacing"
note = "Part 002 96.6 to 97.2 percent. Two fixes. THE DOOR LOOPS ARE FOR LOOPS, not repeat-until: the originals counter is incremented on the loops BACK EDGE, after the test - 1008:060a compares BP-02 and only then reaches the INC - which is how Turbo Pascal lays out a for. Written as repeat with Inc before the until, the increment landed before the compare AND the loop ran one iteration short: for Frame := 0 to 55h turns 86 times, not 85. Same for the hold phase, 26 not 25. That is a behavioural fix as well as an alignment one. AND DEMO_SCENE2 HAS A GLOBAL HANDLE, exactly as LoadFrames does: 108b:2467 is MOV DI,A043 / PUSH DS / PUSH DI where a local would be LEA DI,[BP-n] / PUSH SS / PUSH DI, and the 128-byte frame is a declaration nothing reads. The addresses give the var order for free - DatFile 128 bytes at A043 ends at A0C2, Banners pointer starts at A0C3, then SaveVol and CurVol at A0C7 and A0C8 and RowOfs at A0CA. The allocations also come AFTER the Seek: 108b:2482 pushes 3200h into GetMem only once the file is positioned, where both allocations had been at the top of the routine."

[plan.row."002 108b:00bf"]
label = "ObjTransform: arrays, inline wrap, dead locals"
investigation = "pacing"
note = "DONE, and the span is gone from the list. ObjTransform at 108b:00bf was part 002's third-largest span at 547 bytes; after the rewrite it no longer appears, and the part moves 49.9% to 51.0%. The frame said what to change and every claim below was enumerated from the bytes, in both the disp8 and disp16 addressing forms, over 108b:00bf..03bd. Four corrections. V AND P ARE ARRAYS, not six scalars: the original loads a vertex with Move(O.Vert[I], V, 12) at 108b:02b2 and the pivot with Move(O.Pivot, P, 12) at 108b:0198, which only works if the three LongInts are consecutive in that order -- three separate assignments cannot produce it and the reconstruction had three. THE WRAP IS INLINE SIX TIMES, not a nested procedure: no call and no static link at 108b:00d6, 0100, 012c, 01c3, 01e3, 0203. TWO DEAD DECLARATION BLOCKS have to be transcribed -- 8 bytes at [BP-$08]..[BP-$01] and 12 at [BP-$16]..[BP-$0b], never touched at all -- because leaving them out moves every local after them and the frame stops being $36; their sizes and positions are measured, their types are not recoverable. AND THE DEPTH KEY IS TAKEN AFTER Project rather than before, which LOOKS behavioural and is not: Project writes back only its first two var parameters, storing through [BP+$0c] at 108b:36c4 and [BP+$08] at 36ce with nothing stored through [BP+$04], so Z is unchanged across the call. That doubt cost a disassembly and is recorded so the next reader does not pay it again. WHAT IS STILL OPEN, and it is a type-model decision rather than a transcription: our frame is ENTER $30 against the original's $36. The 46 declared bytes now match exactly -- the loop counter lands at [BP-$0a] in both -- and the six-byte gap is all COMPILER TEMP. The original spills two far pointers, [BP-$32] holding @O and [BP-$36] holding a scratch field address recomputed per group (@O.Accum at 108b:00cc, @O.Angle at 108b:01b6), and the accesses through them read es:[di], es:[di+4], es:[di+8]. That is the signature of NESTED `with` STATEMENTS over RECORD-typed fields -- `with O do` for the outer temp and `with Accum do` for the inner -- which would mean Accum, Angle, Pivot and Trans are three-field records in the original rather than the array[1..3] of LongInt this reconstruction declares. Changing that ripples through a 1,400-line unit and every other routine that touches TObj, so it is not a change to make on the way past. NOT VERIFIED: the `with` reading explains both temps and the exact 8 bytes, but nothing has been built to test it."

[plan.row."002 108b:00c3"]
label = "TObj vectors are records, read under nested with"
investigation = "pacing"
note = "SETTLED BY A PROBE, not by an argument, and the probe is committed as probe/WITHTMP.PAS. ObjTransform's declared locals had already been matched byte for byte -- the loop counter lands at [BP-$0a] in both -- and the rebuild still opened ENTER $30 against the original's $36. The six-byte gap was entirely COMPILER TEMP: the original spills two far pointers, @O at [BP-$32] loaded once from [BP+$10], and a scratch field address at [BP-$36] RECOMPUTED per group (@O.Accum at 108b:00cc, @O.Angle at 108b:01b6), with every access through the second reading es:[di], es:[di+4], es:[di+8] rather than a displacement from @O. The probe compiles one routine FOUR ways with byte-identical declarations so that any frame difference is the construct and nothing else: arrays plain $30, arrays with $34, records plain $30, RECORDS WITH $36. IT TAKES BOTH CHANGES AND NEITHER ALONE, which is why guessing at either one would have failed and been read as the hypothesis being wrong. The probe's prologue is also instruction-for-instruction the original's, both temps at the same offsets, differing only in the field displacements its own record layout produces. Applied: TObj's Angle, Trans, Pivot and Accum become TVec3 records rather than array[1..3] of LongInt, and ObjTransform is rewritten with `with O do` around the routine and `with Accum do` and `with Angle do` around the two groups. Pivot is deliberately NOT inside a `with` -- 108b:018f reloads [BP-$32] and adds $B39, so the original reaches it through @O. One further correction fell out of the probe's disassembly: the wrap is `X := X + 3600`, not `Inc(X, 3600)`. The original loads the pair into AX:DX, adds and stores back at 108b:00e8..00f8; Inc compiles to an in-place ADD/ADC on memory. Same arithmetic, four bytes apart. RESULT: ObjTransform now opens ENTER $36, part 002 moves 51.0% to 53.0%, and routines.py is unchanged at 74 locked, 0 failing. Only 21 call sites needed the field-name change and all were in this unit."

[plan.row."002 108b:03be"]
label = "ObjTranslate: LongInt parameters, a with, and assignment not Inc"
investigation = "pacing"
note = "Three defects in one 100-byte routine, now byte-identical bar the far-call fixup. RET 10h is sixteen bytes of parameters, so DX DY DZ are LongInt not Integer, each read as a single word and truncated into IntToFixed. ENTER 04 is four bytes of frame and no declared local, which is the far-pointer temp of a with O.Trans do; without it the compiler recomputes the address per statement. And the field update is X := X + e, not Inc(X, e): the original loads AX:DX, adds and stores back where Inc emits an in-place ADD/ADC on memory. This unit already had that rule written down for Obj_SetRotation and had not applied it here."

[plan.row."002 108b:0443"]
label = "Three flat arrays were two-dimensional, and a refutation was confounded"
investigation = "pacing"
note = "Part 002 97.8 to 98.4 percent, 194 unaligned bytes down to 69 in three spans. THE SAME SHAPE THREE TIMES: an index expression that the original FOLDS into an addressing displacement and the reconstruction COMPUTES. Rewind - 108b:0443 is IMUL DI,[BP-04],22h then ADD DI,AX reading [DI-714Eh], which is 8ED5h minus 35, so base + (Y-1)*34 + (X-1): a 2-D array indexed Rewind[Y,X], where the flat form emits a DEC and multiplies the decremented value. Banner - 108b:117c has an extra ADD DI,DX, two index contributions added separately, so Banner^[Y-BannerTop, X] on a 2-D array. P2S2s Pal, done last pass. AND A REFUTATION THAT WAS CONFOUNDED: making P2S1s Pal 2-D cost 53 bytes last pass and was recorded as this units loader really does index it flat. Wrong. 1008:01ec writes MOV BYTE PTR [BP-01],0 - the loop counter is a BYTE, not an Integer - and with an Integer counter the compiler shapes the index differently and neither half lands. Changed together they gain 39 bytes. A half-change can refute a whole hypothesis and the note it leaves behind is then false. Also fixed the differ AGAIN: it used capstones own iterator, which STOPS at the first undecodable byte, so a slice starting mid-instruction printed one row and looked like everything after it matched. It uses disasm.walk now, which reports a hole and carries on - the exact thing that tools docstring warns about."

[plan.row."002 108b:0461"]
label = "Tri_Fill and Poly_FillFan are hand asm, not Pascal"
investigation = "pacing"
note = "Transcribed as Borland assembler procedures. Tri_Fill 1250 of 1360 bytes identical (91.9 percent), 56 differing runs, none longer than two bytes and no opcode among them: 54 are DGROUP addresses and 2 are BASM bridging a long conditional with the opposite sense. Poly_FillFan byte-identical, all 88. The 1276-byte span at 108b:0442..093e closed and part 002 went 57.3 to 64.3 percent, plus 1339 bytes, the largest single move recorded. Owed: a watched TPART2 run, because this is the per-frame polygon filler and pacing is what the investigation is about."

[plan.row."002 108b:0a2d"]
label = "The three renderers take the object BY VALUE and inline their helpers"
investigation = "pacing"
note = "Same trade as ObjSortFaces and the watched run says it is the right one. All three open ENTER 1154h and begin with the compilers value-parameter copy - MOV BX,SS / MOV ES,BX / CLD / LEA DI,[BP-0B51] / LDS SI,[BP+04] / REP MOVSB - so each takes the object by value and copies 2897 bytes into its own frame, then addresses SS-relative throughout. They also inline DrawStars, RenderFaces and FlipAndSwap, none of which exists as a routine in the original. All three frames now match exactly. Part 002 75.0 to 78.3 percent."

[plan.row."002 108b:0bb9"]
label = "Loop-limit temporaries must not be declared"
investigation = "pacing"
note = "Four routines in this segment had the compilers for-limit temporaries transcribed as declared locals, which produces both theirs and the compilers and puts the frame over: three renderers 8 bytes over, ObjSortFaces 2. It also forced invented padding bytes, because two of the temporaries sit at ODD offsets and the sub-rule that an odd offset means a preceding one-byte local holds for declarations, not for temporaries. Handing them back to the compiler took the walk 77.4 to 78.3 percent and made all three renderer frames exact. The general rule is the wikis loop-limit-is-a-temporary and prologue.py no longer implies that a touched slot is a declaration."

[plan.row."002 108b:0c8e"]
label = "The scene-2 per-frame path is now byte-identical, and it is STILL slower"
investigation = "pacing"
note = "Measured after a watched run said timing is identical up to the Enterprise scene and then diverges rapidly, which puts the cause in the scene-2 per-frame path. Every span in that path was enumerated: ObjTransform 34 bytes, DrawRewind 29, and 25/25/71 in the three renderer tails - and NOT ONE of them was in a loop that runs per vertex, per face or per star. The renderer tails differed only in PageIndex being declared Integer where the original has WORD: the page swap is INC AX / XOR DX,DX / MOV CX,2 / DIV CX at 108b:0c8e, zero-extend and an unsigned divide, where ours emitted CWD and IDIV. ObjTransforms 34 were SinCos called on the parameters where the original reads back the fields it just stored - identical values, shape only. Both fixed; the scene-2 per-frame path is down to 45 bytes, 29 of them DrawRewind which only RenderB calls. CONCLUSION: our per-frame instruction stream for the Enterprise scene is the originals, the object data matches the DAT carve (75 verts, 55 faces, 118 triangles a frame), the phase counts match, and it is still at least a second slower over 350 frames. The transcription is not the cause and the search should move to data or environment."

[plan.row."002 108b:0e03"]
label = "ObjSortFaces copies the whole object into its frame"
investigation = "pacing"
note = "THE CANDIDATE MECHANISM FOR PACING, and it is the opposite of what it looks like. 108b:0e0c LEAs a 2897-byte local, pushes B51h and calls the runtime Move, and every access afterwards is SS-relative off BP. Nothing reads through the var parameter after the copy. The reconstruction worked through the far pointer for every read, costing a segment load and an ES override per access; the original pays one bulk copy and then uses near addressing. Also fixed: the depth accumulator is the Depth FIELD and is sixteen bit, not a LongInt Sum; the divisor is a fresh read of Face[F].Count with NO zero guard; BestKey is Integer; and 1495 bytes are declared and never addressed. Part 002 72.4 to 75.0 percent. What remains is six bytes of compiler temporary ours has and the original does not, so our ENTER is 113c against 1136 - a probe question, and every variable offset already matches."

[plan.row."002 108b:0f66"]
label = "Present inlines Emit; its whole frame is a compiler temporary"
investigation = "pacing"
note = "ENTER 100h is 256 bytes and every one is the code generators: 108b:0fd4 LEAs it and hands it to the runtime Char-to-String helper at 14b1:3882, which is what passing Msg1[i] to DrawTexts String parameter costs. No declared locals at all, no Emit procedure (no prologue candidate between 0f66 and 1101), and no index guard. The outer Frame > 100 test is redundant and really there: three tests precede the first message, two comparing against 100. Also DrawBanner has TWO Integers not three - the palette loop reuses X - and DrawText has FOUR not five, its deepest slot being the Length(S) limit temp, with no G variable and no range test because -FontFirst is folded into the base displacement. Part 002 78.3 to 80.4 percent."

[plan.row."002 108b:1113"]
label = "P2S2s palette is 256 THREE-BYTE elements, and P2S1s is not"
investigation = "pacing"
note = "Part 002 97.6 to 97.8 percent. 108b:1113 computes 3*X straight into DI and then reads [DI+5148], [DI+5149] and [DI+514A]: the plus one and plus two are ADDRESSING DISPLACEMENTS, which is what an element of three bytes gives you. Declared flat as array[0..767] of Byte, Pal[X * 3 + 1] has to COMPUTE the offset - an INC AX and a MOV DI,AX per component that the original does not have. Changed to TPalette and indexed Pal[X, 0..2]. AND THE SAME CHANGE IN P2S1 MADE IT WORSE, by 53 aligned bytes, so that units loader really does index a flat array: the same source shape is not the same code in both units, and it was worth trying and reverting rather than assuming symmetry. Also this iteration: the side-by-side differ was locking onto the wrong routine, because a best-Hamming-match over the whole image finds any routine with the same shape - LoadFrames and Demo_Scene2 both do Assign/Reset/Seek/BlockRead. It anchors through align.locate on the enclosing routine now, which is the walks own rule and cannot pick a different routine."

[plan.row."002 108b:11c1"]
label = "Choreography inlines the phase body; PA/PB/PC are Integer locals"
investigation = "pacing"
note = "The original has no PhaseFrame, BannerBeat or ClearBannerStrip: prologue.py finds no candidate between 108b:11c1 and 108b:1bbd and the phase body sits inline at 108b:1287, so the reconstruction had three routines the original does not, shifting every routine after them. Inlined all three. PA, PB and PC are LOCALS and INTEGERS, declared PC, PB, PA in slot order, widened with CWD at the call (108b:12a0); six further bytes at BP-08, BP-0a and BP-0c are declared and never read. Frame now matches at ENTER 30e. Part 002 64.3 to 72.1 percent."

[plan.row."002 108b:12e7"]
label = "Frame := Frame + 1, and I/O checking is OFF per unit"
investigation = "pacing"
note = "Part 002 95.4 to 96.2 percent. Choreography is fully aligned. Two findings. Inc(Frame) versus Frame := Frame + 1: 108b:12e7 loads the LongInt into AX:DX, adds 1 with ADD/ADC and stores both words back, where Inc emits an in-place ADD/ADC on memory. The same rule this unit already carried for Obj_SetRotation and ObjTranslate, missed at eleven more sites, each worth 20 bytes in a phase body. AND I/O CHECKING IS OFF: under the default the compiler emits a far CALL to the runtime check after every I/O operation that can fail, and 1008:00d8 goes straight on to the next argument setup. Applied per unit to P2S1 and P2S2. IT IS NOT GLOBAL, and the byte-exact artefacts proved it: adding it to STARTUP.PAS broke TPART0 immediately, so STARTUP is compiled the other way. Reverted and TPART0 is byte-identical again. The command-line form does not work - /$I- was added to build.tomls switch line and the extra call was still emitted, so it was taken out rather than left in the config looking effective."

[plan.row."002 108b:1bbd"]
label = "Scene2_Setup: 128 dead bytes, order still wrong"
investigation = "pacing"
note = "PARTIAL, and the part that landed is the declared frame. Scene2_Setup at 108b:1bbd opens ENTER $8a -- 138 bytes -- and the reconstruction opened $06. prologue.py enumerated every BP access in 108b:1bbd..2453 in both addressing forms: [BP-$02] 79 refs, [BP-$04] 16, [BP-$06] 28, then 128 BYTES NOTHING TOUCHES from [BP-$08] to [BP-$86], then [BP-$88] and [BP-$8a] which are the code generator's -- a LongInt spilled for FILD DWORD at 108b:1cc1 and a for-loop upper bound at 108b:1da4. So 134 bytes are declared and 128 of them are dead, the same shape as ObjTransform and Vector_Animate but far larger. Transcribed as array[1..128] of Byte; the type is NOT recoverable because nothing reads it, though 128 bytes is the size of a String[127], which an asset loader might plausibly declare and not use. The frame is now $86 -- the declared part matches exactly -- and the remaining 4 bytes are the two temps, which will appear only when the statements that produce them do. ONE HYPOTHESIS TESTED AND REFUTED, recorded in the source beside the code rather than in an appendix. The original reads MViewW from memory, widens it unsigned at 108b:1cb6, does FILD DWORD, divides by the single 2.0 at CS:$1baf, multiplies by the extended 0.9 at CS:$1bb3 and pushes DX/BX/AX into a far call -- a six-byte Real handed to a FUNCTION, which reads as RealToFixed rather than Round(.. * 65536.0). Changing it predicted the LongInt spill would appear and the frame would reach $8a. It did not: the frame stayed $86 and the part went 57.3% to 57.2%, so the change was reverted. NOT YET DONE, and this is where the rest of the routine's alignment is. The three Integers are declared in the WRONG ORDER: [BP-$02] is the palette ramp counter AND the inner face-index counter -- one variable in two roles, where the reconstruction has separate Col and K -- so the original declares that variable FIRST and the reconstruction declares it last. And the loops read their limits FROM THE OBJECT rather than from the generated constants: 108b:1da1 loads [0x5a58], which is Obj[1].FaceCount at the object base DS:$5A56 plus 2, where the reconstruction writes `for I := 1 to EnterpriseFaceCount`. The face-index copy also walks a FLAT source table with a running counter in [BP-$06] indexing words at DS:$01c6, where the reconstruction indexes a two-dimensional array. Those three together are the 1,400-odd unaligned bytes still in this routine's range."

[plan.row."002 108b:1cc0"]
label = "P2S2 was N-minus too, and 98.8 percent is the floor"
investigation = "pacing"
note = "Part 002 98.6 to 98.8 percent, ONE span of 16 bytes left. P2S2 had no N directive either: Scene2_Setups projection scale is floating point and 108b:1cc0 is INT 37h, an 80x87 opcode as it ships under E-plus, where ours called the software six-byte Real library with the 0.9 arriving as MOV CX,6680h / MOV SI,6666h / MOV DI,6666h instead of an FLD of the extended constant in the code segment. No other unit in the part does floating point, so there is nothing further of this kind to find here. THE LAST 16 BYTES ARE NOT REACHABLE FROM SOURCE. ObjSortFaces: ours opens ENTER 1138h against the originals 1136h and places Tmp at BP-0B52h against BP-0B51h. The declaration order is identical, Tmp is first in both, and SizeOf(TObj) is 2897 in both - the compiler simply pads the first local by one byte in our build and does not in the original, and it makes one more for-limit temporary than the original reuses. Neither is expressible in Pascal. 98.8 percent is the floor for this part by source-level means; closing it further would need control over local allocation that the language does not give."

[plan.row."002 108b:1cf0"]
label = "Setup: raw tables, the halving in code, a flat face stream - and 30 wrong vertices"
investigation = "pacing"
note = "Scene2_Setup went from 1897 unaligned bytes to about 500 and its frame now matches at ENTER 8a. Four corrections, all from 108b:1cf0..1e4c. The source tables are the RAW ones and the halving is in the code: 108b:1d78 is CWD/MOV CX,2/IDIV CX on every vertex component and 108b:1e1d the same on the colour. The generated include held PRE-HALVED values, which hid the divide and, worse, got 30 of the Enterprise 225 components wrong by ONE - the carve floored where IDIV truncates toward zero. Regenerated raw and the divide is now in Pascal, whose div truncates the same way. The face table is a FLAT variable-length stream (count, that many zero-based indices, colour) walked with one running position in BP-06, not a rectangular array, and each index is incremented on load at 108b:1df6. The loop limits are read back OUT of the object rather than from constants, which is where the frame last four bytes go as compiler temporaries. And the third Integer is that stream position: BP-02 is the outer index and doubles as the palette ramp counter, BP-04 the inner face-index counter. The counts are now emitted by tools/emit_pascal_data2.py beside the tables they count instead of being literals in the loader. THE THIRTY OFF-BY-ONE VERTICES ARE A REAL BEHAVIOURAL FIX and may be visible; the object geometry was subtly wrong before."

[plan.row."002 108b:1e4c"]
label = "Setup trailers and Demo_Scene2: no FillChar, and two Byte globals"
investigation = "pacing"
note = "Part 002 89.2 to 92.6 percent. Setup 588 unaligned bytes down to 48. There is NO FillChar: the objects are DGROUP so they arrive zeroed and the original writes only the fields it wants, distinguishing a plain := 0 (XOR AX,AX and two stores) from := IntToFixed(0) (a PUSH and a call) - both forms are in the binary and both are now transcribed. The counts are written as immediates before each objects loops and read back out of the object by them. Every value was EXTRACTED from 108b:1bbd..2453 rather than typed, and the result verified against the previous working source: no field write lost, 40 added, all of them zeroing fields FillChar had already zeroed, so behaviourally identical. Demo_Scene2: ENTER 80 is 128 bytes and no BP slot is touched - the whole frame is the untyped file, and the Vol : Byte local was written and never read. The saved volume and the ramp counter are two BYTE GLOBALS at DS:A0C7 and DS:A0C8, immediately before RowOfs. And the ramp body is written out TWICE with a test between the halves; reading it as a while GetVolume > 0 loop gave one copy and the wrong test."

[plan.row."002 108b:1fca"]
label = "REGRESSION FIXED: only the Enterprise increments indices and halves its colour"
investigation = "pacing"
note = "I broke the revolver, sailboat and quad geometry by writing all four object loaders from one template. They are NOT one template. 108b:1df6 has INC AX on object 1 face index and 108b:1e1d halves object 1 colour; objects 2, 3 and 4 have NEITHER - 108b:1fca reads the index and stores it straight at 108b:1fd9. All four DO halve their vertex components. Fixed per object and then VERIFIED AGAINST THE OLD WORKING TABLES before building, which is the check I skipped the first time: face data now agrees on 55 of 55, 64 of 64, 21 of 21 and 1 of 1. The vertex correction is retained and is real - the old tables were off by one in 126 components in total (30 Enterprise, 62 Revolver, 34 Sailboat, 0 Quad) because the carve floored where IDIV truncates toward zero. A watched run caught this; no instrument did, because wrong-but-plausible data aligns as well as right data."

[plan.row."002 140c:01af"]
label = "P2View really does carry a second SetRGB, and dropping it cost 18 call sites"
investigation = "pacing"
note = "Part 002 96.4 to 96.6 percent. The reconstruction kept ONE copy of the DAC poke and pointed every caller at VGA.SetRGB, recorded as a deliberate deviation. It has a price the note did not state: P2S2 calls the P2View copy EIGHTEEN times and a far call encodes its targets segment AND offset, so every one of those sites differed in four bytes, which is a run the walk cannot forgive. Declaring SetRGB in P2View restores them - P2S2 uses lists P2View after VGA so the shadowing is automatic - and P2S1 is unaffected because it does not use P2View at all and the original calls 140c:01af zero times from segment 1008. Added to shared-exempt.txt with the reason. ALSO: DS:8ED0 is one Byte written 1 by Setup at 108b:1cae and never read - the whole segment holds exactly that one reference - declared immediately before Frame, which is what puts it there. It cost three bytes of walk because our DGROUP does not match the originals anyway and adding a variable shifts every address after it; kept because the instruction is unambiguously in the binary. AND AN ANSWER TO A GOOD QUESTION: SetPalette768 cannot be a shared include because TP7 refuses I inside an asm block (Error 118, measured 23 Aug), so an include must carry the header - but the exemption OVERSTATES it. VGA.SetPalette768 and P1S4.SetPalette768 have identical declarations and could share one; only PART3_MORPHs untyped var P genuinely cannot."

[plan.row."002 140c:01ca"]
label = "P2View is G-plus, and what the last 420 bytes actually are"
investigation = "pacing"
note = "P2View is compiled with 286 code ON: every routine in segment 140c ends LEAVE / RETF and LEAVE is a 286 instruction Turbo Pascal emits only under G-plus, where G-minus gives POP BP / RETF. prologue.py reads that segment as G-minus and is BLIND rather than wrong: it decides by counting ENTER against PUSH BP and NO routine in the unit declares a local, so both switches emit PUSH BP / MOV BP,SP and neither produces an ENTER. With no locals the entry says nothing and only the EXIT does. The units initialization is now byte-identical in shape to 140c:01ca. CLASSIFIED THE REMAINDER RATHER THAN GUESSING AT IT: for each of the twelve remaining spans, the originals bytes were matched against the whole of our image at every offset and the longest differing run measured. 35 bytes are ADDRESSES ONLY - no run longer than two - and 385 are real code differences. An earlier belief that the remainder was dominated by address differences was WRONG and the measurement is what said so. Also re-tested and refuted a second time: MScale as RealToFixed rather than Round times 65536. The first refutation had been confounded by the loop-limit temporaries being declared as locals, so it was worth re-running once the frame reached 8a on its own - and it is still wrong, 18409 aligned bytes down to 18408."

[plan.row."002 142a:004b"]
label = "FIXMATH WAS N-MINUS AND THE ORIGINAL IS 80x87 - and it is the per-vertex path"
investigation = "pacing"
note = "THIS MAY BE THE PACING ANSWER AND IT WANTS A WATCHED RUN. 142a:004b is not an address difference: the INSTRUCTION SEQUENCES differ. The original calls one runtime routine and then executes x87 instructions - 142a:0050 is INT 3Ch, which under E-plus is what an 80x87 opcode ships as. Ours set up MOV CX,91h / XOR SI,SI / XOR DI,DI and called a different routine, which is the SOFTWARE SIX-BYTE REAL LIBRARY. FIXMATH.PAS had no N directive at all so it took the N-minus default. THIS IS THE PER-VERTEX PATH: ObjTransform calls FixedToInt once per vertex, FixedToInt calls RealToFixed, so about 75 times a frame went through the software Real library instead of the emulator. Part 005s record already says what that switch was worth there. Corroborated by SIZE, independent of any alignment number: our part 002 load image was 28,800 bytes against the originals 38,832 - ten thousand too small, which is what dropping the 80x87 support does - and is 40,480 now. Parts 001, 002 and 005 all gained. AND IT UNCONFOUNDED A REFUTATION: MScale as RealToFixed was refuted twice and lands on the third test, because both earlier tests ran while FixMath was N-minus and a software-Real call takes its argument differently from an 80x87 one. It now gains four aligned bytes and makes the executable smaller, 40,512 to 40,480."

[plan.row."002 142a:0071"]
label = "Where ObjTransform actually spends its time: FixMath, per vertex"
investigation = "pacing"
note = "ObjTransforms per-vertex loop is the originals code - only 34 of its 767 bytes diverge and they are in the once-per-object SinCos setup, not the loop - so the cost is in what it CALLS. Per vertex it far-calls Move (12 bytes), RotatePoint, Project and FixedToInt. FixedToInt is the expensive one and it is the originals own design: 142a:008a computes RealToFixed(0.5) AT RUNTIME on every call, and RealToFixed at 142a:0034 carries TWO 80x87 emulator traps (FMUL at 0051, FADD at 0057, shipping as INT 3x under E-plus) plus three RTL far calls. So the depth conversion alone costs about six far calls and two software-emulated float operations PER VERTEX - roughly 450 far calls and 150 emulated float ops per frame for a 75-vertex object. That is where the time goes. It does NOT explain our slowness: two of our divergences made us FASTER, because build.toml passes /S-minus for the whole project while the original compiled FixMath and only FixMath with stack checking ON - about 150 checks a frame we were skipping. Fixed by a unit-level switch; FixMath now aligns fully and parts 001, 002 and 005 all moved up."

[plan.row."002 1436:0000"]
label = "VGA layout, and a build that silently ignored an edit"
investigation = "pacing"
note = "Part 002 96.2 to 96.3 percent, and the important part is not the number. The remaining spans are cross-segment CALL SITES whose encoded offset differs because a units internal layout differs: CopyScreen is at 1436:0128 in the original and was at 0x9c in ours, so every far call to it differed in four bytes. Turbo Pascal emits a units code in implementation order, so the order in VGA.PAS IS the segment layout. Moved SetMode13h, VirtScrAlloc and VirtScrFree to the front, which is where 1436:0000, 0006 and 0033 put them. SetMode13h is SIX bytes - no frame - so it is assembler, and it does NOT call BuildRowTable: the row table is built by the units INITIALIZATION, which is what the seventeen bytes at 1436:017f are (PUSH BP / MOV BP,SP / CALL 015A / LEAVE / RETF, emitted last as an initialization always is). VirtScrFree is twenty-one bytes and is nothing but the FreeMem - no nil guard, nothing cleared afterwards. AND A BUILD HAZARD: the VGA reorder appeared to do nothing through two builds. The staged source was correct and the TPU had been deleted, yet the old code kept coming out; deleting build/VGA.PAS as well fixed it, and it could not be reproduced afterwards. build.py always copies, so there is no mtime comparison to blame and the mechanism is NOT established. The practical lesson is the one WORKING.md already gives - verify a change landed by measuring it, never by assuming - and rm build/*.TPU build/*.PAS before believing a null result."

[plan.row."002 1436:00d6"]
label = "The VGA unit now matches the originals layout routine for routine"
investigation = "pacing"
note = "Part 002 97.2 to 97.6 percent. PaletteFadeOut belongs between PaletteDim and WaitRetrace, which is where 1436:00d6 puts it: PaletteDim ends at 00D6, the fade runs to 011A, WaitRetraces fourteen bytes follow and CopyScreen is at 0128. Declared near the end of the unit instead, CopyScreen landed at 00E4 and every far call to it from another segment differed in four bytes. EVERY ROUTINE IN THE UNIT NOW SITS AT THE ORIGINALS EXACT OFFSET - 0048, 0063, 0083, 008b, 009b, 00b3, 00d6, 0128, 0144, 015a all match. AND AN INSTRUMENT NOTE: prologue.py reports ONE routine of 82 bytes at 00D6 and there are TWO. WaitRetrace has no standard prologue so the scan cannot see it and folds it into its neighbours extent. The tell is the call 011A inside that extent - a routine does not call into its own middle - and it is what turned a wrong 82 into the right 68 and 14. Part 001 gave up 7 bytes for this; net strongly positive."

