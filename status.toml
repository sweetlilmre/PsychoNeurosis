[[plan.investigation]]
name = "part5-hand-asm-three"
finding = "PART 005 REACHES 100.0% -- three hand-assembler blocks and two small findings, and a PROBE decided the biggest one. THE 41-BYTE SPAN AT 1102:0082 was P5S3's clip-and-sample, and three tells said assembler independently: both coordinates live in REGISTERS across four bounds tests with no store (AX from 007f to 00a6, BX from 0092 to 00a2, each compared twice and then USED -- Turbo Pascal frames every local, so a Pascal SX is written before it is tested and read back for each comparison); 1102:00a0 is ADD BX,BX where the compiler emits SHL BX,1; and 1102:0087 is 3D 00 00, CMP AX,0 in the LONG immediate form, twenty bytes from 83 FB 00 which is the SHORT form of the same operation. A code generator picks one rule and keeps it, so the INCONSISTENCY is the signature -- the same shape as part 003's morph scene using JE/JMP five times then plain JNE three times. THE 31-BYTE SPAN AT 1096:034a WAS SETTLED BY probe/MULSIGN.PAS, which is the model for this kind of question. It spells (X1 - X0) * T div Denom + X0 EIGHT ways -- addend at either end, the multiply's operands swapped, the difference lifted into its own variable, the quotient cast down, and LongInt casts on the left operand, the multiplier and the divisor -- and drives all eight through TP7, TP6 and TP6.1. Every 16-bit spelling emits MUL / CWD / IDIV and the two casts call the runtime instead. NOT ONE of the twenty-four builds emits the original's CWD / IMUL / IDIV. AND OURS WAS ARITHMETICALLY WRONG: MUL leaves the product in DX:AX and the CWD that follows overwrites DX with the sign of AX, so the product's top half was thrown away before the divide saw it -- any dot whose (X1-X0)*T exceeded 16 bits interpolated from a truncated dividend. An EARLIER attempt cast the left operand to LongInt and measured worse, and the note recorded that as 'the cast forces the RTL 32-bit multiply'. True, and it was one spelling tried once against a whole-part percentage; the probe tried eight and read the bytes. THE THIRD BLOCK IS THE SAME STORY IN THE OTHER DIRECTION. With YOfs a Word array and X0 an Integer, YOfs[Y0] + X0 promotes to LONGINT, so ours built the pixel offset in 32 bits -- CWD, a CX:BX pair, XOR DX,DX, ADC, then a MOV that discards the high half -- where 1096:027d is ADD BX,BX and 0283 is ADD DI,X0, sixteen bits throughout. Two sites. Wiki: word-plus-integer-is-longint. TWO SMALL ONES CLOSED THE REST. 100e:0571 is MOV AL,[BP+4] / MOV [BP+4],AL -- a dead SELF-ASSIGNMENT OF A PARAMETER, the first thing HeightFromMap does, and another instance of the shape this target keeps finding. And 1096:04f6 computes $C800 BEFORE the LES that fetches the segment, which is a two-argument Ptr call evaluating right to left, not a Mem subscript evaluating left to right -- the operand-order rule applied to a call. WHAT IS LEFT IN PART 005 IS THREE BYTES AND NONE OF THEM IS OURS: 1096:049e, 1096:050b and 1252:002d are the same far call, lcall 0x2d9:0x38fb against ours 0x2f8:0x391c -- a runtime routine at a different offset in a differently sized runtime segment. That is the floor, and part 002 is already sitting on it."
state = "open"

[[plan.investigation]]
name = "shared-unit-near-far"
finding = "THE SMALLEST PART IS WHERE YOU READ A SHARED UNIT'S LAYOUT, and part 007 proved it in sixty-four bytes. Its segment 100b is the WHOLE of VGA smart-linked down to the four items part 007 references -- SetMode13h, SetTextMode, BuildRowTable and the initialisation -- and at that size the unit's routine ORDER and its NEAR/FAR split are simply legible, where the 2,000-byte version of the same unit in another part is not. Three findings came out of one 64-byte dump. (1) BuildRowTable IS NOT AN INTERFACE ROUTINE: 100b:0030 is C3, a NEAR return, and Turbo Pascal compiles every interface routine FAR -- and 100b:0034 is E8 D5 FF, a near CALL to it from the initialisation, which is the same fact from the caller's side. Declared in the interface it returned far and cost a byte at both ends. Nothing outside the unit calls it; ModeX declares its own BuildRowTable and that is the one part 002 scene 1 reaches. (2) SetTextMode IS AN assembler ROUTINE AND COMES BEFORE BuildRowTable: 100b:0006 is B8 03 00 / CD 10 / CB, six bytes and no frame, where ours was a Pascal procedure wrapping an asm block -- PUSH BP / MOV BP,SP ... LEAVE, four bytes more -- and declared after BuildRowTable, which shipped the two at each other's addresses. (3) THE PAYOFF WAS CROSS-PART, which is the whole argument for reading the shared unit rather than the part: part 007 went 99.0 to 99.4 and part 006 went 99.3 to 99.4 on the same three edits, with nothing lost anywhere and all three byte-exact artefacts still holding. AND THE SAME QUESTION ANSWERED THE OTHER WAY IN P7S1. 100f:084b is CB -- RETF ending PlayAll, which nothing outside the unit calls -- and 100f:0883 and 0887 are 0E E8, PUSH CS then a NEAR CALL, which is Turbo Pascal's four-byte far call to a routine in the same segment. So that unit is F+ and every routine in it is far, where only Scene1 was in our interface and the rest compiled near: C3 for the return, a plain E8 for each call, one byte lighter at every site and at the wrong address for all of them. F+ took part 007 from 99.4 to 99.7. THE PAIR OF TELLS, worth carrying: a NEAR return in a routine you declared in the interface means it does not belong there, and PUSH CS before a near CALL means the callee is FAR and in the same segment. Both are one byte and both are unambiguous. WHAT IS LEFT IN PART 007 IS TWELVE BYTES and ten are one-byte far-call targets into the runtime. The other two are at 100f:0662, where both sides build a table of procedure pointers in Scene1 and dispatch the chunk case through it, but the MEMBERSHIP differs -- the original calls FliColor256 directly with PUSH CS / CALL where ours goes through the vector."
state = "open"

[[plan.investigation]]
name = "p1s1-hardcoded-lens-base"
finding = "THE LENS SPRITES WERE TWO PIXELS OFF, AND THE CAUSE WAS A HARDCODED ADDRESS IN A CORRECTLY IDENTIFIED, CORRECTLY TRANSCRIBED ASSEMBLER BLOCK. BuildCell gathers the 40x40 working cell through the lens table, and it is hand assembler -- that part was right. What was wrong is one displacement: the original's 1012:036f is LEA AX,[DI-895], and -895 is 1641 minus 746 where 746 is where THAT build put Under. Ours puts Under at 744. So the routine read two bytes into every saved row and all 1,600 pixels of every one of the ten bouncers came from two columns along -- visible on a watched run as sprites that are nearly right, reported from a screenshot. THE FIX IS SHORTER THAN THE BUG: LEA AX,[DI + OFFSET Under - 1641], which the assembler evaluates at build time from THIS build's layout. It emits -897 now and will emit the original's -895 by itself once the two missing bytes are found; either way the code reads the right memory. AND THE INCENTIVE RUNS THE WRONG WAY, which is the part worth carrying. Because the literal matches the original's bytes EXACTLY, the byte-level score REWARDS the bug: writing -895 scores better than writing the correct expression, by exactly the layout gap. Anybody optimising the percentage puts it back. The one instrument that could see it -- dsmap -- reports a displacement two bytes off because a variable moved and a displacement two bytes off because it was hardcoded in the SAME column, so it cannot distinguish them. spans read 99.0% before and 99.0% after, dgimage identical both ways, fpusites identical both ways, paslint clean. Second instrument-invisible behavioural defect in two days, both found by the maintainer's eyes. Wiki: transcribe-the-meaning-not-the-constant. THE SWEEP THE OBSERVATION ASKS FOR IS DONE AND IT IS CLEAN. Every numeric displacement and immediate in every transcribed asm block across the tree was read and asked the one question -- is this a PLACE or a QUANTITY. BuildCell was the only place. The others are quantities (DEMOVT's $5472 is the ASCII 'Tr' magic, PART3_MORPH's $02FF is the last index of a 768-byte palette) or ES-relative structure fields (DEMOVT's $121 and $123, P6S4's $100), all legitimately literal. WHAT REMAINS IS THE TWO BYTES THEMSELVES. Our P1S1 block sits two bytes below the original's throughout -- Under folded at 744 against 746, LensTab at $4302 against $4304, Cell at $4FD4 against $4FD6 -- so something two bytes wide is missing ahead of it in DGROUP. That is a layout hunt, not a correctness one, and the code is now correct either way."
seen_in = "TPART1"
state = "open"

[[plan.investigation]]
name = "p1-flat-vector-tables"
finding = "PART 001 FROM 99.0 TO 99.3 ON FOUR FINDINGS, and the best of them is a new tell. THE VECTOR TABLES ARE FLAT AND ZERO-BASED, AND THE ORDER OF TWO MULTIPLIES SAYS SO. Vector_Run copies 36 and 48 points out of DGROUP twice over, and both loops carried 65 unaligned bytes. The counter is scaled by six either way, but 12c5:08a6 does it as MOV SI,AX / SHL AX,1 / ADD AX,SI -- times THREE -- and only then MOV DI,AX / SHL DI,1, times two. A two-dimensional [I, 1] subscript emits the halves the other way round, times two then three, because it scales by the ELEMENT size and the element is three Integers. Times three THEN two is an INDEX of I * 3 into a ONE-dimensional Integer array, the trailing SHL being the Integer stride. The fold confirms it independently: VecGlobe is at DS:$01A8 and the displacement is $1A8 -- the base itself -- so the subscript contributes nothing to the fold and its low bound is ZERO. Ours folded to $1A2, one 6-byte element low, and Turbo Pascal paid for the difference with an INC AX on every point. GETTING THERE TOOK TWO STEPS AND THE FIRST ONE MEASURED WORSE, which is worth recording: array[0..n-1, 1..3] fixed the fold and the INC and took the part DOWN to 98.6, because the two loop bodies then came out two bytes SHORTER than the original's and everything after them misaligned. The multiply order was the missing half. array[0..n*3-1] flat closed both clusters from 65 bytes to one. The bound lives in tools/emit_pascal_data2.py, which generates the include -- the generator was changed, not the generated file. THE LAST BYTE OF EACH CLUSTER WAS A THIRD LOCAL. 12c5:08a0 stores the point pointer's offset at [BP-$0A] and its segment at [BP-$08]; with only I and W declared above it P landed at [BP-$08] and the frame below shifted two bytes. One never-read Integer between them fixed both sites. BLOB 1 IS FILLED BY A STATEMENT OF ITS OWN. 1107:0113 pushes ProfileA and the ABSOLUTE address $80F7 with a count of $31, and only after that call does 1107:0124 set the counter to 2. $80F7 is Blob[1].Pix exactly -- Blob begins at $80F5 and Pix is two bytes in, past the (W, H) header. So the first blob is written un-looped and blobs 2..144 by the loop, which together is every blob. Redundant, and what ships. Worth 15 bytes. AND ONE BYTE HAS NOW SURVIVED TWO ATTEMPTS, both recorded on the declaration so nobody spends a third. The original folds the two 49-byte profiles as [DI+$5B69] and [DI+$5B9A], so the second begins at $5B9B -- immediately after the first, on an ODD boundary. Ours folds to $5B9B, one high, because default word alignment pads a 49-byte array to 50. Byte alignment for the whole unit: 21100 to 21093 aligned, seven worse, because the directive is not local to those two names and cost four other places what it gained. One array[1..2, 1..BlobPixels]: 21100 to 21087, thirteen worse, even though its two rows reach BOTH measured folds exactly on paper -- row 1 at base-1 = $5B69 and row 2 at base+48 = $5B9A. Something about the Move and BlockRead call sites pays for it. The two cheap explanations are spent. WHAT IS NEXT IN PART 001 IS STRUCTURAL AND IT IS THE 14-BYTE SPAN AT 1107:057c. 1107:057e is 9A C0 00 B2 02 -- a FAR call to segment 0x2b2, which relocates to 0x1000+0x2b2 = 12b2 -- and 1107:0587 is another to 12b2:00f1. Ours makes NEAR calls to routines inside P1S4's own segment. So two routines that belong to the unit occupying segment 12b2 are declared in P1S4 instead, and the near/far difference is the same one-byte pair of tells the shared-unit work used. Verified state: part 001 dgimage identical at 752 bytes, traps identical, dsmap 163 paired with 146 at +0, three artefacts holding, paslint clean at 67 files."
state = "open"

[[plan.investigation]]
name = "part4-layout-and-prologues"
finding = "PART 004'S DATA SEGMENT IS NOW RIGHT, AND A HISTOGRAM OF ONE INSTRUCTION FOUND IT. The coverage walk could not see any of this -- it read 99.0% before and after the layout work, because it locates code by CONTENT and a folded displacement is one operand inside a matching instruction. What saw it was collecting every ADD DI,imm16 in both binaries and sorting them: 26 folds each side, and the two lists diverge at exactly the tenth. That is a five-line script and it decided a whole segment. THE FIRST DEFECT WAS +900 AND THE ARITHMETIC NAMED IT EXACTLY. 1005:043c reaches WalkBank[Frame] with ADD DI,$4EC where ours emitted ADD DI,$870, and $870 - $4EC is 900. ScenePal (768) + F (128) + Font (4) is 900, and all three were declared at the FRONT of the var block while their measured addresses -- $CC07, $CF07, $CC03 -- put them at the very top of DGROUP. Moving them to the end, with DeathAPic which had the same problem, made the first fourteen folds identical to the original's. The tail now tiles with nothing left over: SideAnim $BC4F + 840 = DeathAPic $BF97 + 3180 = Font $CC03 + 4 = ScenePal $CC07 + 768 = F $CF07 + 128 = $CF87, and VGA's VirtScr is $CF88. THE SECOND WAS 2,646 UNDECLARED BYTES, and dsmap had been pointing at it for two days. TumbleBk begins at $06D2 and is 400 bytes, so it ends at $0862; SplatBank is at $12B8; the gap is $A56 = 2,646. Fifty paired references carried a shift of exactly -2646 with every other reference in the part at +0 -- a bounded run of one shift, which is the recorded signature of a missing or misplaced block. Declared as a measured spare, dsmap went from 116 references paired with 61 at +0 to 151 paired with 146 at +0, and the -2646 group vanished. 2,646 is 7 x 378 and 378 is this part's glyph stride, so seven somethings of 378 is the guess; LoadAssets reads TWENTY blocks and the unit names about fifteen. The SIZE is measured and the contents are not, which is how this corpus writes that. THEN prologue.py CLEANED UP THE CODE, and it is the cheapest instrument here. It compares every routine's prologue against ours and it found six disagreements in one run. 1005:17ff is PUSH BP / MOV BP,SP with NO ENTER where ours opened ENTER $08 -- a routine with no declared locals that still wants eight bytes is holding temporaries, and `Inc` on an INDEXED field is what put them there. 1005:1802 is IMUL DI,[BP+4],$15 / MOV AX,[DI+$302] / INC AX / IMUL again / MOV [DI+$302],AX -- loaded into a register, incremented there, stored back, with the subscript's multiply done TWICE. The original recomputes that IMUL five times in Splat and keeps nothing, which is what leaves it frameless. Four sites converted to longhand (Splat, Builder, DeathA, DeathB, Fuse) and four of the five unlocated routines located. NOT every Inc in the unit is wrong: Bounces at 1005:0BE2 really is the short form, and a blanket replace would have broken it. THE LAST ONE WAS A GUARD CLAUSE. 1005:07e4 is JNE over a JMP -- two jumps, four bytes -- where a wrapping `if Active <> 0 then begin ... end` emits one short JE. Conditional-over-unconditional is what `if cond then Exit` gives: the JNE skips the JMP and the JMP goes to the LEAVE. With that, EVERY PROLOGUE IN PART 004 MATCHES: prologue.py reports zero differing and zero unlocated across 30 candidates. Part 004 is 99.0 -> 99.1 on the walk, which badly understates it -- the walk was blind to the 3,546 bytes of layout. Two spans remain: 1005:1d2f (17), which spanwhy still classes as addresses-only, and 1005:07c4 (16), whose first length change is 904 bytes upstream at 1005:043c, where both sides now emit identical instruction shapes but ours sits 642 bytes later -- so there is extra code before DrawSprite, not different code in it."
state = "open"

[[plan.investigation]]
name = "part3-two-objects-not-one"
finding = "PART 003 TO 99.3%, AND THE INTERESTING PART IS THAT TWO CONTRADICTORY MEASUREMENTS WERE BOTH RIGHT. dsmap showed 46 references to VGA's data block paired at exactly -124 over $E76C..$E913, with 140 others at +0 -- a bounded run, the recorded signature of a missing block. Walking PART3_SPRITES' declared addresses closed the arithmetic: Trig is 360 x 4 = 1,440 from $D29C so it ends at $D83C where Wobble begins, Wobble another 1,440 to $DDDC, and TargetPal is 768 from $E3EC so it ends at $E6EC -- while VGA's VirtScr is at $E76C. A 128-byte gap, and this corpus has found an unopened or unit-level file record in that shape seven times before. 125e:0342 SETTLED IT: MOV DI,$E6EC / PUSH DS / PUSH DI as the file argument to the TargetPal BlockRead. A data-segment address, where a local would be LEA'd off SS. AND THE NOTE ALREADY ON THE LOCAL WAS ALSO CORRECT, which is why the earlier attempt failed. Load opens ENTER $626 = 1,574 = 128 + 2 for I + a 1,444-byte buffer, all three measured, and I sits at [BP-$82] precisely BECAUSE 128 bytes are nearer BP. So there really are 128 bytes at [BP-$80] AND a 128-byte file record at $E6EC. The previous attempt moved the record to unit level by DELETING the local, which removed 128 bytes the frame genuinely has, and cost 338 bytes -- recorded on the declaration as 'the DS: note was simply wrong'. It was not wrong; it was incomplete. Both objects exist. The local is kept, renamed Spare, and the global added: the -124 group vanished and the part went 99.1 to 99.3 with the initialised image still identical at 40,736 bytes. THE LESSON WORTH THE WORDS: when two measurements of the same unit disagree, the resolution may be that there are TWO OBJECTS rather than one wrong reading. 'The frame says local' and 'the instruction says global' were both true. Deciding which one to believe was the error. prologue.py FOUND NOTHING IN PART 003 -- every routine's prologue across eleven segments already matches, which is why the remaining work here is data and statement shape rather than frames. WHAT IS LEFT IS ONE CAUSE AND IT IS FOUR BYTES. dsmap now shows 53 sites at +4 over $C586..$E913 with everything below at +0, so four bytes too many sit at or just below $C586. PART3_GLOBE's file record is at $C506 and 128 bytes long, ending exactly at $C586, so the four are at the front of whatever block follows it -- PART3_WAVES, whose CurveTab pointer and P array run from there to SweepX at $d20a, a span of 3,204 bytes. Four bytes is a pointer, and that is where to look."
state = "open"

[[plan.investigation]]
name = "walk-tail-artefact-ruled-out"
finding = "A NEGATIVE RESULT WORTH KEEPING, AND A PROCESS ERROR WORTH ADMITTING. THE ERROR FIRST: this tick picked its target from a span list produced two ticks earlier and spent the whole tick on 11ee:0284, a 12-byte span in part 006 that no longer exists -- the shared-unit VGA work had already closed it. The walk must be re-run before choosing a target, every tick, because the previous tick's edits move the list. Cheap to do, and it cost a tick not to. WHAT THE TICK RULED OUT, which is worth having: the coverage walk is NOT understating these parts through a tail artefact. The suspicion was concrete. align.spans() walks the original in WINDOW-sized chunks and calls locate() on each; when a chunk fails to anchor it advances ONE byte and sets a gap, and when fewer than ANCHOR (10) bytes remain it breaks and yields everything from the gap to the segment's end. So a segment's trailing remainder can be reported unaligned while being byte-for-byte identical -- and the mechanism that makes it fail is real: locate() caps its candidate search at 64 positions, and a probe that includes a unit's padding zeros matches everywhere, so the cap is exhausted on wrong alignments before the right one is scored. A unit's initialisation section is eight bytes plus padding, which is exactly that shape. MEASURED ACROSS ALL SEVEN PARTS: exactly ONE reported span reaches a segment's end -- part 004's 1005:1d2f, 17 bytes -- and its bytes are NOT identical to ours, so it is a real difference. Every other span ends mid-segment. So there is no phantom inflation to remove and NO REASON TO CHANGE THE INSTRUMENT. That matters because 'the tool is under-reporting' is the most flattering possible explanation for a stalled percentage, and it happens to be false here. AND ONE MEASUREMENT METHOD FAILED TWICE BEFORE GIVING A USABLE ANSWER, which is the reason the number above is trustworthy. Asking 'do the span's bytes appear anywhere in our image' returned 184 phantom bytes across seven parts -- meaningless, because a one-byte or two-byte chunk matches any 20KB image by chance, and most of the remaining spans are one byte. Padding the chunk with twelve bytes of context either side returned ZERO phantoms -- also wrong, because at a divergence boundary the neighbours differ by definition, so the padded test can never pass there. The answer only came from asking the narrower question the tool's own loop implies: does the span reach the segment's END, and if so does the whole segment locate with the tail matching exactly. Two plausible measurements, both useless, before the right one. THE STANDING TOTAL IS 409 BYTES ACROSS SEVEN PARTS AND ALL OF THEM ARE REAL: part 001 144, part 004 97, part 003 85, part 006 60, part 007 12, part 002 8, part 005 3. Of those, parts 002, 005 and 007 are at their floor -- 23 bytes between them, all far-call targets into a runtime segment at a different offset, which no edit to a routine changes. So the reachable work is 386 bytes in parts 001, 003, 004 and 006."
state = "open"

[[plan.investigation]]
name = "p1s1-for-loop-and-two-bytes"
finding = "THE FOURTH ATTEMPT AT PART 001'S 19-BYTE SPAN, AND THE FIRST ONE THAT LEARNED SOMETHING. Three earlier tries concluded the loop counter cannot be a local; that conclusion is WRONG and this records why, so the fifth attempt starts from the right place. THE LOOP IS A `for` OVER A LOCAL, AND THE BOTTOM TEST PROVES IT. 1012:05b1 is CMP WORD PTR [BP-$54],$12C followed by JE to the LEAVE and then JMP back to the top, with NO INCREMENT anywhere between the last statement and the test. Testing for EQUALITY against the limit, with the increment at the loop's head, is exactly what Turbo Pascal emits for `for`; a `repeat ... until Frame > 300` emits an Inc and a greater-than. And 1012:05a7 reads the same slot for the scroll threshold, so [BP-$54] is the counter and it is a frame slot. The frame already has room: four 20-byte arrays plus I is 82 and ENTER $54 is 84. MAKING THAT CHANGE CLOSED THE 19-BYTE SPAN COMPLETELY -- it vanished from the span list -- AND COST 47 BYTES SOMEWHERE ELSE, a new 67-byte span in P1S2's code at 1082:05c0. Net 21115 to 21068, so it was reverted. The mechanism is the one already recorded: with the loop using a local, the unit-level Frame is referenced by nothing, Turbo Pascal smart-links it away, and P1S1's data block loses two bytes. Comparing absolute references in $5600..$5800 shows it exactly -- the original's block runs 56c0, 56c2 ... 56d0 and ours ran 56be, 56c2 ... 56cc, two low throughout. SO BOTH THINGS ARE TRUE AT ONCE, which is the same shape as part 003's file record: the counter IS a local, AND two bytes of P1S1's data segment need a home that something references. Choosing between them was the error in all three previous attempts. AND THE TWO BYTES ARE NOT A VARIABLE IN THE ORIGINAL. $56C0 is referenced twice and both references are from segment 1082 -- 1082:0033 writes it and 1082:05c4 pushes it -- so it is P1S2's variable, not P1S1's. Nothing anywhere references $56BF. P1S1's file record sits at $563F and is 128 bytes, ending at $56BE, so the next address is the ODD $56BF and word alignment pads it to $56C0. There is no variable there at all: it is one byte of alignment padding. WHICH MEANS THE TWO BYTES OUR Frame OCCUPIES ARE NOT IN THE ORIGINAL AT THAT PLACE. Something else in P1S1's block is two bytes larger than we have it, or the block ends two bytes later for a reason not yet found, and the global has been standing in for that all along. The next attempt should find those two bytes FIRST -- with the reverted build in hand, P1S1's declared sizes against its measured addresses -- and only then convert the loop. Converting first will always cost 47 bytes. One other thing the reference comparison turned up: in the reverted state our absolute references in that window match the original's exactly, EXCEPT that ours carries one at $5737 which the original does not. That is a separate loose end and small."
state = "open"

[[plan.investigation]]
name = "watched-runs-1-and-4"
finding = "BOTH OWED WATCHED RUNS ARE CLEAR, reported by the maintainer who ran them: TPART1 is good and SLIGHTLY FASTER than the original part 001, and TPART4 measures and looks the same as the original part 004. That covers everything this session changed in part 001 -- the P1STAR unit split moving StarInit, StarStep and StarDraw to segment 12b2, the P1S4 and P1S5 routine reorders, ShowWord's KeyPressed Exit which now skips the 100-frame outro, the lens BuildCell fix and the frame-counter local -- none of which had been seen running. It also covers part 004's palette fix, where the ScrollPal chain read byte C*3+2 instead of C*3+3. SLIGHTLY FASTER IS NOT NOTHING AND IT IS NOT YET A DEFECT. Nothing changed this session removes work from a steady-state frame. The two candidates are the CopyScreen deleted before the bounce loop, which went on a byte measurement rather than a behavioural one, and ShowWord's Exit, which now skips the outro on a keypress where before it always ran. Both match the original. A 1994 demo timed by its own loops rather than by a clock also runs differently under DOSBox-X than on the hardware it was written for, so only a comparison of the two builds on the SAME emulator setting means anything -- and that is what was reported. Worth one more look if the difference is VISIBLE rather than measured, because frame time is the one class of defect no instrument here can see: spans, dsmap, dgimage, prologue and fpusites all read an image and none of them reads a frame."
state = "open"

[[plan.investigation]]
name = "part4-duplicate-tail-block"
finding = "PARTS 004 AND 006 ARE AT THEIR HARNESS FLOOR EXCEPT FOR ONE BYTE, and finding that out took reading every span rather than the totals. Part 006's 38 unaligned bytes are 35 sites and EVERY ONE is an lcall operand into the runtime -- segment 0x28a against ours 0x2a8, offset +104 -- including those that disassemble as an add through bp+si, which is the same operand read from the middle of the instruction. Part 004's 43 sites are the same but for ONE. So 99.6% and 99.4% are not 38 and 59 bytes of reconstruction work; they are 1 byte and 0. THE ONE BYTE IS A REAL LEAD AND MAY BE BEHAVIOURAL. 1005:0c80 is E9 to 0xd16 where ours is EB to 0xcee -- near against short, because the original's target is 40 bytes further. 0xd16 is the routine's LEAVE. 0xcee..0xd15 is a SECOND COPY of the block at 0c62..0c7f: IMUL DI,[BP+4],$15 three times, the byte at DI+$30B incremented, the word at DI+$302 divided by 4 plus 1 and stored back -- which is Inc of Y, Inc of FallDist, and Frame := Frame mod 4 + 1. THE SOURCE HAS THAT STATEMENT TWICE, once before an Exit inside the search loop at PART4_LEMMINGS line 1264 and once after the loop as the routine's last statement at line 1281, which is why the block appears twice in the binary. The original's jump goes PAST the second copy to the epilogue, which is what an Exit does. Ours goes TO it. If that reading holds, our lemming's frame advances twice on the Exit path where the original advances it once. NOT YET SETTLED, AND THE ARITHMETIC IS WHY: our addresses run one BELOW the original's from 0c83 onward, so our 0cee maps to the original's 0cef, which is mid-instruction and an impossible jump target. Either the shift is not uniform or the target is not what it looks like. sitedump REFUSES to anchor anywhere near 0cee -- no 8-byte identical run exists before it -- which is itself evidence of a real divergence the walk resynced around and then priced at the single byte where the opcode changed. Read the routine's exits as a whole rather than this jump in isolation."
state = "open"

[[plan.investigation]]
name = "p1s4-align-four-bytes"
finding = "THE FOUR BYTES AT 1107:044d ARE ONE 4-BYTE OBJECT SHORT OF FREE, and this tick found which measurement says so. Setting A-minus on P1S4 closes 1107:044d completely -- Transform's pointer local moves from [BP-$14] to the original's [BP-$13] -- and the walk reads 7 WORSE, 21244 to 21237, which is where two earlier attempts stopped. dsmap says the opposite and it is the instrument that can see data. WHAT A-MINUS ACTUALLY FIXES IS THREE RECORDED FINDINGS AT ONCE. The switch does not pad record SIZES in TP7 -- records are always packed and the Trail array's stride is 13 either way -- it pads variable PLACEMENT: a variable following an odd-sized one gets word-aligned. So under the default, ProfileA's 49 bytes push ProfileB to $5B9C where the original folds it at $5B9A, and ProfileB pushes Work to $5BCE where the original has $5BCC. Under A-minus, ProfileA at $5B6A ends at $5B9B, ProfileB begins there exactly as the original folds it, and Work lands on $5BCC to the byte. dsmap's boundary list confirms it: the +2 group at $5BCE and the +3 group at $6A2F both VANISH and $5BCC reads +0. That is the one-byte ProfileA/ProfileB question that survived four attempts, and it was never about those two arrays -- it was the switch. WHAT IT COSTS IS ONE GROUP, NAMED. A single new boundary appears, $AAC2 shift -4, and it explains both new spans: 1012:06dc is PUSH WORD PTR [$AB58] and 1082:036a is a jump whose target moved, both in the region that slides when the block before it shrinks. So P1S4's unit-level data under A-minus is FOUR BYTES SHORT of the original's, and the default's padding had been standing in for a four-byte object we have never declared. Find those four bytes and A-minus closes 1107:044d, the ProfileA fold and the Work shift together, for nothing. THE INSTRUMENTS DISAGREE AND THE WALK IS THE ONE THAT IS BLIND HERE. spans reads 7 worse because it locates code by content and a moved global changes two bytes of every instruction that reads it; dsmap measures the displacements directly and reads four shift groups reduced to one. Reverted for now because the walk is the plan's bar and the four bytes are not yet found -- but the next attempt should NOT re-measure whether A-minus helps. It should look for a four-byte object at or just below $AAC2, with A-minus set, and only then judge."
state = "open"

[[plan.investigation]]
name = "part2-initialised-image"
finding = "PART 002'S INITIALISED IMAGE IS 512 BYTES BETTER AND THE REST IS A TWO-SIDED LAYOUT JOB. Msg1 and Msg2 were declared as plain String VARIABLES and assigned in P2S2's initialisation section, so they landed in the UNINITIALISED block; the original has them as initialised typed constants at DS:$046E and DS:$056E, 256 bytes apart, each a full String[255] with its length byte ($3B and $35) already in the image. Declared as typed constants immediately after MViewH -- which is where the addresses put them -- the data image goes from 2,864 bytes against the original's 3,408 to 3,376, and the walk gains 8. WHAT IS LEFT IS TWO DISCREPANCIES IN OPPOSITE DIRECTIONS, which is why the total of 32 bytes short badly understates it. The marker MViewW+Msg1 (40 01 f0 00 3b 43) sits at $046A in the original and $0AA8 in ours, so our initialised data AHEAD of it is 1,598 bytes too big, and everything after Msg2 is about 1,630 too small. The original's pre-MViewW block is $000A..$0469, exactly 1,120 bytes of what look like coordinate pairs (30, -30, 140, -30 ...); ours is 2,720. So we declare roughly 1,600 bytes as initialised that the original does not, and fail to declare about the same amount that it does. AND ONE SMALL DEFECT IS EXACT: the original has an initialised Word of 80 ($50) at DS:$0002 where ours has zero, and its table therefore starts at $000A where ours starts at $0008. Two bytes, first in the block, and it shifts every comparison after it -- which is why dgimage reports 2,207 bytes differing when the content is largely the same data two bytes over. Fix that one first: it makes every later reading legible."
state = "open"

[[plan.investigation]]
name = "part2-dgroup-order"
finding = "PART 002'S DATA-IMAGE HEAD IS A LINK-ORDER QUESTION, NOT A MISSING DECLARATION, and Ghidra settled it in one query. The original's initialised block opens 00 00 / 50 00 / 00 00 / 00 00 / 00 00 and then the coordinate table at DS:$000A; ours opens with eight zero bytes and the table at $0008. The $50 at DS:$0002 is MODEX's LogicalWidth -- 1008:0727 writes $A0 to it as a BYTE and 107c:000e and 107c:00c5 read it back, which is Demo_Scene1 setting the wide canvas before SetModeX and BuildRowTable use it. AND WE ALREADY DECLARE IT CORRECTLY: MODEX.PAS line 55 is LogicalWidth : Byte = $50, a typed constant, initialised. So the byte is not missing from the source -- it is in the wrong PLACE in DGROUP. In the original, MODEX's initialised data comes FIRST in the block; in ours it does not, which is why our $0002 reads zero. Our CODE order matches the original's (part 002 walks at 99.9%), so the data order and the code order are not the same order in the original, and that is the thing to understand next. It is the same class as P1INTRO's uses clause running in reverse segment order. THE OTHER HALF IS BIGGER AND PULLS THE OTHER WAY. The marker 40 01 f0 00 3b 43 sits at $046A in the original and $0AA8 in ours, so our initialised data ahead of it is 1,598 bytes too big and everything after Msg2 about 1,630 too small. The original's pre-table block is $000A..$0469, exactly 1,120 bytes; ours is 2,720. So we declare roughly 1,600 bytes as initialised that the original does not, and fail to declare about as much that it does. Do the two-byte head first: it shifts every comparison after it, which is why dgimage reports 2,207 bytes differing when most of it is the same data two bytes over."
state = "open"

[[plan.investigation]]
name = "part2-image-identical"
finding = "ALL SEVEN INITIALISED DATA IMAGES ARE NOW IDENTICAL. Part 002's was the last, and the plan had it recorded as the one data-layout job left. It went 2,864 bytes against the original's 3,408 with 1,863 differing, to 3,408 and NONE, in four measured steps. Msg1 and Msg2 were String VARIABLES assigned in the initialisation section, so they sat in BSS; the original has them as typed constants at DS:$046E and $056E, 256 bytes apart, each a full String[255] with its length byte in the image. The four 3-D models were emitted as ONE include and the original splits them: model one's tables at DS:$0004, MViewW and MViewH at $046A, Msg1, Msg2, the four clip bounds and the two nibble masks at $066E, and only then models two, three and four from $067E. TWO FACE COUNTS WERE ONE SHORT, and they were hand-typed. The Revolver's face stream runs from $0816 to the Sailboat's vertices at $0B06 -- 376 words -- where 64 faces give 371; the Sailboat's runs $0BC6..$0CAE, 116 words, where 21 give 111. Each was one whole face of five words, so a polygon of the revolver has never been drawn in any run of this reconstruction. The counts are DERIVED from the extents now, because the extents are measured and a typed count is a guess. AND P2VIEW'S PageBase AND WritePage WERE var, NOT const. The original has 0, $4B00, 0 at DS:$0CE6..$0CEB, immediately ahead of PageIndex -- PageBase[0], PageBase[1] and WritePage with their compiled-in values. The addresses recorded against them, $A696/$A698/$A69A, were OUR build's BSS, not the original's. Six bytes, and the last with a cause. WHAT IS LEFT IN PART 002 IS 13 BYTES: 6 far-call operands and 2 that no instrument can localise -- 108b:1ec8 and 108b:209e, where sitedump refuses to anchor and the classifier's decode drifts. The walk went 19,077 to 19,075 across this work, which is the cost of our initialised region growing 26 bytes to its correct size and moving what follows."
state = "open"

