h ends at 07da, and nothing can be declared after a unit's `begin`. That also settles the routine that had bothered three sessions -- MulLong is called from NOWHERE in the image and ships anyway, because an object is linked per MODULE where Pascal is smart-linked per PROCEDURE. src/asm/STARMATH.ASM is new and the dead routine came through the linker exactly as that predicts. WAVES' Run IS NOT A NESTED PROCEDURE CALLED FOUR TIMES. 120f:020c stores 30 into Curve with no test in front of it, and the PROLOGUE had said so more cheaply: frame $06 with NO [BP+n] references at all, so no parameters and no static link, so it cannot be nested and cannot take two arguments. Reading that would have settled the shape without disassembling a single seeding loop. The four passes are written out inline and segment 120f is now fully aligned. Its SweepX step was an Inc where the original assigns, too. MEASURED: part 003 95.6 -> 97.6%, no other part moved, three byte-exact artefacts hold, paslint clean, and part 003's 92 emulator traps identical opcode for opcode."
