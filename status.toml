resolution = "PART 001 89.4% -> 89.9%, and the fix was one distinction applied in three places: `:= 0` AND `:= IntToFixed(0)` ARE NOT THE SAME CODE. A direct zero is XOR AX,AX and two register stores; IntToFixed(0) is a PUSH and a far call whose result is then stored. 1107:0903 and 1107:094e are the first form (XOR then stores, no call), and 12c5:0918 stores an ALREADY-ZERO AX twice with nothing before it. Three sites corrected: Trail[Idx].Z, Trail[0].X and .Y, and Obj.Pos.X. Note that Obj.Pos.Y and .Z genuinely DO call IntToFixed -- 12c5:091e pushes -70 and 12c5:092c pushes 1600 -- so this is not a blanket rule and each site has to be read. AND THE DISTINCTION WAS ALREADY WRITTEN DOWN IN THIS REPOSITORY, in P2S2.PAS, as a comment explaining exactly which form the original uses and why. Part 002 is at 99.9% and its eight IntToFixed(0) calls are deliberate. So the knowledge existed in one part's source and had not reached two others. A cross-part grep found no other sites, so this class is now closed everywhere. MOSAIC_RUN WAS OPENED AND DELIBERATELY NOT CHANGED. 10e3:00bb's ENTER $18 decomposes plausibly -- two Words at [BP-6] and [BP-8], two Bytes at [BP-$0B] and [BP-$0D], and eleven unreferenced bytes at the deep end that would fit two array[1..5] of Byte if those were declared LAST where ours has them second. But our routine contains an asm block that references every local BY NAME, so reordering the var block silently changes what that block addresses, and the frame cannot distinguish the arrangement I guessed from two others. Not attempted without reading the whole routine."

[[plan.investigation]]
name = "part1-dgroup-audit"
finding = "part 001: THE DGROUP SHORTFALL IS NOW THE DOMINANT RESIDUAL and the per-routine work is close to exhausted -- no span exceeds 131 bytes and several of those are displacement noise rather than wrong code. dsmap pairs 88 references and FIFTY-FOUR of them carry a large negative shift: -16808 across $ACEB..$ACFB with 38 sites, -17576 across $AAC2..$AAD2 with 10, and -17176 at $AB54..$AB58 with 6. Each is a wrong two-byte displacement inside an otherwise correct instruction, which is the one defect class that makes a whole routine measure as unaligned while containing nothing wrong. WHAT IS KNOWN AND WHAT IS NOT. P1S4's own block is close: its Col at $6A2F carries -5619, and summing what we declare between $6A2F and $AAC2 -- 2,048 of row buffers, 3,776 of font, 7,395 of blobs, 810 of stars, 1,212 of model, 52 of sprite, 1,200 of screen records, 28 of maths -- gives 16,521 against the original's 16,531, ten bytes out. So the SIZES in that range are essentially right, and a shift that grows by 11,957 across a range whose contents differ by ten CANNOT be explained by those declarations. Either the -5619 pairing is wrong (it has four sites, which is thin) or the units sit in a different ORDER so that something else lies between them. DO NOT GUESS THIS ONE. The arithmetic above is exactly the kind that looked convincing twice this session and was wrong both times. What it needs is a per-unit size audit against the original's inter-variable gaps -- mechanisable, and the sources' own DS: comments are the input, as they were for P1S4. A tool that reads those comments, sorts them, and reports each declaration's declared size beside its measured gap would settle it for every unit at once and is worth writing before another hand pass."
