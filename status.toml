resolution = "RESOLVED, AND THE BLOCKER I RECORDED DID NOT EXIST. This said the row table at $AB5A was missing and had to be built before the assembler could be written. VGA.PAS already declares it -- `YOfs : array[0..ScrHeight - 1] of Word` -- along with BuildRowTable to fill it, and PutPixel already uses the exact idiom the star blitter needs, MOV DI,[BX + OFFSET YOfs] after SHL BX,1. I had grepped for the name `RowOfs`, which is what MODEX.PAS calls its equivalent, and concluded from its absence that the thing was absent. GREP FOR THE SHAPE, NOT THE NAME: two units in this repository hold the same table under different names, and one of them was the one I searched. STARDRAW IS NOW BYTE-FOR-BYTE IDENTICAL TO THE ORIGINAL. Written as `far; assembler;` and transcribed verbatim: PUSH BP / MOV BP,SP with no ENTER, MOV BX,0 rather than the XOR the code generator emits, MOV CX,$5A with DEC CX / JNE, a bare STOSB, and DX holding BX across the row lookup because BX is needed as the table index. All 45 bytes match except four absolute DGROUP displacements -- $9DE3, $9DDB, $9DDD and $AB5A against ours -- which is the allowed-difference class. SHIFTTRAILS at 1107:059f, +132 and the biggest single item of the batch. ENTER 2 is TWO BYTES and no third local: both counters are Bytes (1107:05a3 and 05ac are MOV BYTE PTR) and the row index is recomputed inline rather than kept, which is why there is no room for it. It also takes the trail BY POINTER, and the pointer is @Trail[1] rather than @Trail -- 1107:06aa is MOV DI,$5BD9, one record in -- so the parameter needs a ONE-based view of the same records. 1107:05ce reads ES:[DI-1] after DI += K*13, and that minus one is the low bound and the Flag field's offset 12 folded together. SCENE2's Close, no measured change but correct: 1082:05a4 closes the file AFTER the call to Load returns, where ours closed it inside Load. AND TWO THINGS CHECKED AND FOUND ALREADY RIGHT, which is worth recording so nobody re-checks them. P1S3's grey ramp constant: the original holds an 80-bit Extended at CS:$000D and decoding it gives 0.2470000000, exactly what we have. And the ramp really does recompute the expression three times per entry -- nine x87 sites where one subexpression would cost three -- which our source already does and comments."

