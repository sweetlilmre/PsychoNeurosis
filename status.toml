[plan.row."001 P1S4 $5B52"]
label = "our maths block is 18,000 bytes out, not 4 -- an ORDER defect"
investigation = "part1-layout"
target = "R0"
note = "PART 001's +4 IS NOT WHAT IT LOOKED LIKE, AND P1S4's BLOCK IS THE REAL PROBLEM. The cheapest probe in this target settled it in one command: SinCos is called with the ADDRESSES of MCos1 and MSin1 as literals, so both builds print their own maths block's position.   the original   1107:0456 pushes $5B52, $5B56   and   12c5:02ea pushes $AAA6, $AAAA   ours           pushes $A0F0, $A0F4             and   pushes $AAAA, $AAAE P1S5's maths block is +4, as dsmap said. But P1S4's is at $A0F0 against $5B52 -- EIGHTEEN THOUSAND BYTES OUT, not four. That is not a shift, it is a declaration ORDER defect inside P1S4: the original declares its maths EXTRNs near the START of the unit's block and ours declares them near the END, after F, Trail, Outp, Blob, Star, Font, the two profiles, Pal, Row/Col/Idx and Rows. AND THE ADDRESSES ALREADY RECORDED IN THE FILE CONFIRM IT AND DO NOT TILE. P1S4's own comments hold $5B52 (MCos1), $6A2D/$6A2F/$6A31 (Row, Col, Idx), $6A33 (Rows), $80C2 (stride $33), $80F3 (Angle) and $9DDB (stride 9). Sorted, MCos1 comes FIRST of those and Angle nearly last -- while the source declares the two adjacent. The unit's block runs from about $5A52, where P1S2's ends, to $A105 where P1S5's begins: roughly 18,900 bytes, with MCos1 sitting 256 bytes into it, so two 128-byte records or one 256-byte buffer precede it. DO THE TILING EXERCISE, exactly as part 005's was done this morning: sort every measured address, difference the consecutive pairs, and match each gap against a declared size. That took one of part 005's numbers from 112 to 80 and made two further declarations readable that had been invisible against the wrong baseline. Part 001 has MORE addresses recorded than part 005 did, so it should close faster -- and until it does, every absolute displacement in two of the part's largest units is wrong and correct code measures as wrong. DO NOT CHASE THE +4 SEPARATELY. It is P1S5's block sitting four bytes high because P1S4's ends four bytes late; fixing P1S4's tiling is likely to take it with it."

[plan.row."001 P1S4 measured"]
label = "the folds name the arrays: Rows at $6A33 and Angle before Blob both close"
investigation = "part1-layout"
target = "R0"
note = "P1S4's DGROUP MEASURED FROM THE BINARY RATHER THAN FROM THE FILE'S COMMENTS, which is what the last block asked for and is now most of the way done. Two passes over segment 1107: every ABSOLUTE `ptr [0xNNNN]` displacement, and every FOLDED `[reg +/- 0xNNNN]` base. The absolute list is short and complete -- $5B52, $5B56, $5B5A, $5B5E, $5B62, $5B66; then $5BCC, $5BCE, $5BD0, $5BD2, $5BD4, $5BD6; then $6A2D, $6A2F, $6A31; then $80F3. Everything else in the unit is reached through a fold or a pointer. THE FOLDS NAME THE ARRAYS AND THEIR STRIDES:   $5B69  di = Ord(ch)          a 1-based BYTE array at $5B6A   $5B9A  di = Ord(ch)          a 1-based BYTE array at $5B9B -- 49 later, which is                                BlobPixels, so these two ARE ProfileA and ProfileB   $5BD8  imul ax,ax,$12 then imul di,ax,$D, and elsewhere imul di,[$6A31],$D   $632F  imul di,ax,7          a 1-based array of SEVEN-byte records at $6336   $6933  mov di,[$6A2D] / shl di,8    a 1-based array of 256-byte elements at $6A33   $6A2A  add di,dx / add di,cx       a two-subscript array whose bounds sum to 9   $80C2  imul di,ax,$33        a 1-based array of 51-byte records TWO OF THOSE CLOSE COMPLETELY AND BOTH CONFIRM A RECORDED ADDRESS. $6933 plus 256 is $6A33, so `Rows : array[1..TrailRows] of String` really is at $6A33. And $80C2 plus 51 is $80F5, so the 51-byte array starts THERE -- which puts Angle's two bytes at $80F3 immediately in front of it, exactly where the absolute list says Angle is. Blob follows Angle; it does not precede it, and the source has them the other way round. SO THE ORDER, AS FAR AS IT IS MEASURED: MCos1..MSin3 at $5B52 (24) -> ProfileA $5B6A (49) -> ProfileB $5B9B (49) -> six words $5BCC (12) -> the 234-byte-element array at $5BD8 -> the seven-byte-record array at $6336 -> ... -> Row, Col, Idx at $6A2D -> Rows at $6A33 -> Angle $80F3 -> Blob $80F5. OURS DECLARES THE MATHS BLOCK LAST OF ALL and it belongs FIRST, which is the eighteen-thousand-byte displacement. STILL OPEN: what the six words at $5BCC are; what the 234-byte-element array at $5BD8 is (strides 18 and 13, so array[.., 1..18, 1..13] is the shape to try, and 18x13 is 234); what starts at $6336 with seven-byte records; and where the block BEGINS -- P1S2's ends at $5A52 and MCos1 is at $5B52, so 256 bytes precede the maths block, which is either P1S3's whole block or two 128-byte file records or one String."

[plan.row."001 P1S4 reordered"]
label = "the maths block is at $5B52 now; +7 and +4 are all that is left"
investigation = "part1-layout"
target = "R0"
note = "P1S4's DGROUP IS REORDERED TO ITS MEASURED ADDRESSES AND THE EIGHTEEN-THOUSAND-BYTE DISPLACEMENT IS GONE. dsmap's change list is now readable end to end: +0 to $0284, -2 to $56CA, +0 AGAIN FROM $5BCE TO $6A2D, +7 from $6A2F to $80F3, +0 from $878B, +4 from $AAC2. Before this the maths block alone was 18,000 bytes out. Paired references went from 89 to 98 and unpaired from 183 to 174; the +0 group went from 12 distinct offsets to 17. THE ORDER WAS DERIVED FROM THE FOLDS, NOT FROM THE COMMENTS, and two of them closed completely: $6933 plus 256 is $6A33, so the row buffers are there; and $80C2 plus 51 is $80F5, so Blob starts there -- which puts Angle's two bytes at $80F3 immediately in front of it. THE SOURCE HAD BLOB FOURTH AND ANGLE LAST. The measured order is F ($5AD2), the six maths LongInts ($5B52), ProfileA ($5B6A), ProfileB ($5B9B), Trail ($5BD8), Outp ($6336), Pal ($672D), Row/Col/Idx ($6A2D), Rows ($6A33), Font ($7233), Angle ($80F3), Blob ($80F5), Star ($9DDB) -- and four of those gaps tile to the byte: $6336 + 145*7 = $672D, $672D + 768 = $6A2D, $6A33 + 2048 = $7233, $7233 + 3776 = $80F3. AND A GUESS THAT MEASURED WORSE WAS BACKED OUT, which is the part worth keeping. P1S2's block ends at $5A52 and F is at $5AD2, so 128 bytes appear to precede it; declaring an eighth unopened file record there, plus six words at $5BCC for the six absolute displacements between ProfileB and Trail, took the shift from +4 to +144 -- exactly the 140 added. Both were removed. The block's TOTAL was already right; only its order was wrong, and adding declarations to explain gaps that the ordering already accounts for is how a balanced total gets unbalanced. STILL OPEN, and both are small: +7 from $6A2F to $80F3, which is seven bytes appearing between Row and Col -- impossible for two adjacent Integers, so one of those two pairings is a fold rather than an address and needs checking before anything is declared. And the +4 from $AAC2, which is scene 5's block, unchanged."

