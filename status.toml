finding = "PART 005's REMAINING 99-BYTE SPAN IS A DGROUP ORDER DEFECT, AND IT IS 32 BYTES. Every one of P5S2's variables is exactly 32 higher than the original's -- I1 $63E8 against $63C8, TabSin $63F2 against $63D2, TabCos $7394 against $7374, TabU $8336 against $8316, TabV $92D8 against $92B8 -- while P5S1's are all at +0 and P5S1's EdgeBuf ends at exactly $63C8, which is where scene 2's block begins in the original. AND THE TOTALS ARE BOTH IDENTICAL, which is what makes it an ORDER defect and not a size one: dgimage reports 11,648 bytes against 11,648 with no differing byte, and the MZ header's minalloc is 3,082 paragraphs in both. So nothing is missing and nothing is surplus -- 32 bytes are in the wrong PLACE, sitting between P5S1's block and P5S2's, and P5S2's own Spare is 30 short of the gap it fills to compensate. That is the '30 bytes not accounted for' the Spare's note has carried for days: it is not 30 unexplained bytes, it is a 32-byte block on the wrong side of a unit boundary. WHERE THE 32 BELONG. The original puts P5S3's shared maths variables at $A662 -- 1102:0027 pushes MCos1 at $A662 and MSin1 at $A666, 1102:0018 MCos2 at $A66A and MSin2 at $A66E, and MScale is at $A67A -- which is immediately after P5S2's file record ends at $A661. Six LongInts plus MScale is 28 bytes and the block is 32. So they are the FIRST variables of scene 3's block, and in our link order something 32 bytes wide has landed in front of scene 2's instead. WHAT TO DO. Find what our build places at $63C8 -- the wiki's `DGROUP order reverses the uses clause` is the page for it -- and once it moves, P5S2's Spare becomes 128, WHICH IS A FILE RECORD'S SIZE. This target has found five routines and one unit declaring a file they never open; a sixth at exactly 128 bytes would stop being a number that balances and start being a declaration that was read. Worth the 99-byte span and probably the 13-byte one at 1096:0277 with it. AND A SECOND, SMALLER ONE IN THE SAME FAMILY: dsmap shows +2 at $A5DC and nowhere else, so two bytes sit between Speed and Index in ours that do not in the original."
