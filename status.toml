[plan.row."005 1096:0042"]
label = "Shatter: P5S2 was missing {$G+}"
investigation = "pacing"
note = "THE SWITCH, NOT THE ROUTINE, and the evidence had been sitting in the unit's own comment for days. P5S2 carried no {$G+}, so every framed routine in it opened PUSH BP / MOV BP,SP / SUB SP,n where the original opens ENTER -- a 286 instruction Turbo Pascal emits only under $G+. Both framed routines in segment 1096 open ENTER: $26,0 at 1096:0042 and $04,0 at 1096:03d7. The unit's {$S-} comment quoted `ENTER $26,0` as its justification for the stack-check switch and nobody read it as evidence about $G. Eight other units had the switch added on exactly this evidence; this one was missed. Measured: part 005's coverage walk goes 80.4% to 88.1% -- 885 bytes, the largest single move this target has recorded -- and Shatter's own span at 1096:0042..01ec falls from 426 bytes to 96 at 1096:016d..01cd. routines.py unchanged at 74 locked, 0 failing, so the locked verbatim BASM in the unit survived the codegen change, which was the risk: $G changes register allocation and not merely encodings. HOW IT WAS FOUND MATTERS MORE THAN THE FIX. The observer's scene-by-scene run split scene 2 into a slow image build and a rotozoom that looked right, which named Shatter; the coverage walk independently made Shatter the part's largest span; and the frame comparison then showed the prologue form differing rather than the body. Three instruments, one address. A SWEEP OF THE OTHER UNITS FOUND NO SECOND CASE, and two candidates were REFUTED rather than assumed: FIXMATH's original segments 1483 and 142a carry no ENTER at all, and P2VIEW's 140c carries none either, so both are correctly $G- and adding the switch would have been wrong. What the sweep could not finish is the unit-to-segment mapping for the drivers and the remaining small segments -- linkorder and mapcmp would answer it, and both want target.image, which this target deliberately leaves unanswered because it is nine part binaries rather than one."

[plan.row."005 1096:03d7"]
label = "Scene 1-to-2 switch (PARKED)"
investigation = "pacing"
note = "PARKED at the observer's call on 24 Aug 2026, with part 005 at 88.1% and the queue moved to part 002. Left here so the next session picks it up rather than rediscovers it. The residual has MOVED twice under measurement and both moves were informative. First report: a multi-second black-screen pause between scenes 2 and 3 -- closed by {$N+} on P5S2. Second: scene 2 overall slower with the image build slow and the rotozoom right -- that split named Shatter, and {$G+} on P5S2 took 885 bytes off the part and Shatter's own span from 426 to 96. Third, after that change: a slight lag in the SCENE SWITCH between 1 and 2, which is a transition cost rather than a per-frame one and matches the very first description of this part as a slow rotozoom setup. Where to look, unread: the boundary is Demo_Scene2's preamble at 1096:03d7 -- GetMem of the $FFFF texture at 1096:0485, the 200-row texture load at 1096:04ee, and the motion-table build at 1096:051a whose loop body runs 2001 turns making 4,002 trig calls. The coverage walk still reports 1096:0477..0537 unaligned at 192 bytes, covering the GetMem and the head of that table build, so the eye and the walk agree on the boundary exactly as they did on Shatter. Read that span before theorising: three times running on this part, the routine the observer's eye picked out was also the walk's largest unaligned span in that region."

[plan.row."005 1096:051a"]
label = "Scene2 motion-table build"
investigation = "part5-386-trio"
note = "The investigation's premise was stale: the 386 trio (SinCos/RotatePoint/Project) HAS been transcribed since the 19 Aug part-005 re-read (P5S3, verified fragments). The cost was the motion-table build in Demo_Scene2 -- loop body 1096:051a..0591, entered by the JMP at 1096:0514 -- which is 80x87 code in the original: FILD the index, FDIV by a SINGLE 180.0 at CS:$03c9, FLD the ten-byte EXTENDED Pi at CS:$03cd, then the RTL's Sin (CS:$32ad), Cos (CS:$32b2) and Round. P5S2 compiled under the $N- default, sending those calls through the software six-byte-Real RTL instead. Fixed by {$N+} on P5S2, and the reason is fidelity rather than speed: $N- emits no 80x87 instructions and therefore no emulator traps at all, so the traps in the 1994 file are positive evidence of $N+. TWO FIGURES CORRECTED HERE, both measured against bin/NEUROSIS.005 on 24 Aug 2026. The loop body carries TWELVE traps, not fourteen -- fourteen is the count for the whole of Demo_Scene2 at 1096:03d7..06b7, so the number was right with the wrong extent attached to it. And the loop makes 4,002 trig calls, not 3,424: the counter at DS:$63ca is seeded at 1096:050f and tested against $7D0 at 1096:0592, so it turns 2001 times at two calls a turn. 3,424 is not reproducible from this loop and is dropped. There is no raw 80x87 opcode anywhere in the shipped binary and there is none in ours either; both ship $E+ traps and both are executed by the emulator, since the demo never had a coprocessor. Settled independently of anyone reading a trap by building the unit both ways: $N+ aligns part 005 at 80.4%, $N- at 79.2%, so $N- moves the rebuild 137 bytes further from the 1994 file."

