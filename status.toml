[[plan.investigation]]
name = "part3-s6-left-dark"
finding = "part 003 scene 6: left half of the dot object renders darker than the original"
seen_in = "TPART3"
state = "resolved"
resolution = "The left half was dark because Waves_LoadCurves' own palette was missing: the routine does not stop at the curve BlockRead -- it lays a blue TRIANGLE ramp over colours 1..178, brightest mid-phase, so both ends of every curve are dim and no half of the shape is darker than the other. The reconstruction had inherited the previous scene's monotone ramp instead. Two secondary recoveries from the same investigation: the erase/draw BASM block is back verbatim with the original's stray-store bug (row 003 120f:00fe -- real, but not this defect's cause), and the fpu variants proved to be post-build patches of the CD 3x emulator interrupts, so the build keeps $E+. Fix confirmed against ORIG3 side by side by a watched run on 22 Aug 2026; the part-tier rung moves when TPART3 is re-observed through observe.py."

[[plan.investigation]]
name = "part1-s4s5-palette"
finding = "part 001: palette glitch at the scene 4 to scene 5 transition"
seen_in = "TPART1"
state = "resolved"
resolution = "The binary's Demo_Scene5 (12c5:0a89) flushes keys, clears the screen to colour 0, allocates and clears the work buffer (12c5:0a60), and only then lets Vector_Load rewrite the DAC -- over black, so the swap is invisible. The reconstruction went straight into Load, recolouring scene 4's still-displayed final frame for the whole file read and backdrop build. Scene5 rebuilt to the binary's structure, opcode-identical modulo fixups; a watched run confirmed the transition looks right against ORIG1 on 22 Aug 2026. Residual part-001 speed differences continue under the pacing investigation."

[[plan.investigation]]
name = "part5-386-trio"
finding = "part 005: a multi-second black-screen pause between scenes 2 and 3. FIXED IN CODE, AWAITING A RUN -- do not re-do it. The name is kept because the record cites it, but its premise was wrong twice over: the 386 trio was already transcribed, and the cost was not run-time trig at all. P5S2 compiled under the $N- default, so 3,424 trig calls went through the software six-byte-Real RTL. The original's table build at 1096:051a is 80x87 CODE -- and it ships, as ours does, as INT 34h..3Dh emulator traps: 14 of them sit at that address in the shipped binary. THE AUTHOR HAD NO COPROCESSOR, so in 1994 the emulator executed them; the RTL patches them to real opcodes at startup only where one is present. So $N+ is about which CODE is emitted, never about x87 versus the emulator, and $E+ stays as it was. {$N+} on P5S2 matches the original's shape and the built TPART5 carries the same trap form. The remaining Sin/Cos in P5S2 is FAITHFUL and must not be removed. What is owed is one run of TPART5 beside ORIG5, watching that transition."
seen_in = "TPART5"
state = "resolved"
resolution = "Resolved by a watched TPART5 run beside ORIG5 on 24 Aug 2026: the multi-second black-screen pause between scenes 2 and 3 is gone and the part performs almost identically to the original. THE CHANGE THAT CLOSED IT WAS {$N+} ON P5S2, AND IT IS NOT A PERFORMANCE FIX -- it is fidelity, which is the only reason it is defensible. THERE IS NOT ONE RAW 80x87 OPCODE IN THE SHIPPED 1994 BINARY, and that is not an argument against $N+: under $E+ every 80x87 instruction ships with its two-byte WAIT ESC prefix overwritten by a two-byte INT 34h..3Dh, so what is in the file is traps. $N- emits no 80x87 instructions at all and therefore NO TRAPS EITHER -- floating point becomes far calls into the software six-byte-Real library, with nothing for an emulator to emulate -- so a trap is positive evidence of $N+ rather than evidence against it. The demo never had a coprocessor; Turbo Pascal's emulator executed every trap in 1994, ours ships and runs them the same way, and $E+ was never touched. MEASURED INDEPENDENTLY OF ANYONE READING A TRAP: building P5S2 $N- and walking every byte of part 005 against the 1994 file drops the alignment from 80.4% to 79.2% -- 137 bytes FURTHER from the original -- so had the original been $N-, that number would have moved the other way. Two figures in the earlier record are corrected here. The motion-table loop body at 1096:051a..0591 carries TWELVE traps, not fourteen; fourteen is the count for the whole of Demo_Scene2 at 1096:03d7..06b7, so the number was right with the wrong extent attached. And the loop makes 4,002 trig calls, not 3,424: the counter at DS:$63ca is seeded at 1096:050f and tested against $7D0 at 1096:0592, so it turns 2001 times at two calls a turn; 3,424 is not reproducible from this loop and is dropped. Under $N- those same 4,002 calls went through the software Real RTL instead. Two watched runs bracket the switch with nothing else in the unit moving between them, so the pause was there under $N- and is gone under $N+; WHY is NOT MEASURED, and it is not that anything gained an FPU -- both builds run the emulator over the same traps, so any account of the speed is about two different pieces of software doing floating point, and nobody has timed them. What the run still shows is a marginal overall slowness and a slight slowdown in the rotozoom setup, where the image assembles out of the pixel shower; the observer judged that good enough to move down the priority ladder, and it carries over to the pacing investigation as row 005 1096:0042 rather than holding this one open. The 386 trio was never the cause; it had been transcribed on 19 Aug and the name is kept only because the record cites it."

