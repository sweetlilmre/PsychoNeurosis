resolution = "RESOLVED, AND THE DECISION IT WAS WAITING ON EVAPORATED. All four changes landed together plus two more the bundle exposed, and part 003 went 89.1 to 90.6 percent with its initialised data BYTE-IDENTICAL. The four were: the driver's two volume Words at $9F1A/$9F1C; a harness that does not write through the text RTL; PART3_STARS' file record as a LOCAL of Demo_Scene2; and Tunnel's two-byte hole at $A7EE. THE TWO THE BUNDLE EXPOSED ARE THE INTERESTING ONES. First, Tunnel declared `Unread : LongInt` AFTER its file record, four bytes added at some point to make the block reach $A880 -- and it had been compensating for PanX/PanY, Angle/Radius and RotTmp all being in the wrong places. With those corrected the file record ends at $A880 on its own, so the four bytes became a surplus that pushed every PART3_STARS variable up by four. A declaration that exists to make a total come out is one to re-examine the moment anything under it moves. Second, PART3_STARS needs BOTH a local file record AND a unit-level one. The ENTER $80 at 10b8:0592 proves the local; removing the unit-level declaration moved every variable from $BE90 up by exactly 128. The two pieces of evidence that looked contradictory were measuring different things, and the unit declares a second record it never opens. AND THE HARNESS QUESTION IS ANSWERED WITHOUT A TRADE. The 2-byte cost was worth 752 bytes of the walk on this part alone -- 90.6 against 85.2 -- but printing through BIOS teletype, INT $10 function $0E, avoids the text RTL entirely while KEEPING the prompt. Write(s, #13, #10) does not; that was measured too. The generator does it for every harness now, so nobody has to choose between an exact data segment and a usable harness."

