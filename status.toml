resolution = "RESOLVED, AND IT WAS AN ARITHMETIC SLIP IN A COMMENT THAT COST THIRTY-TWO BYTES FOR DAYS. Part 005 98.1 -> 98.8%, and its DGROUP is now EXACT: dsmap pairs 181 references with 180 at +0, against 144 paired and 67 unpaired before. THE 32 BYTES WERE IN SCENE 1, NOT SCENE 2. P5S1's dead block was declared 112 bytes on a note that read `RowOfs starts at $5DFE and its 200 words end at $5F6E`. $5DFE plus 400 is $5F8E. EdgeBuf is at $5FDE, so the gap is EIGHTY and not 112. Thirty-two bytes too many there pushed the whole of scene 2's block up by thirty-two -- I1 at $63E8 against $63C8 and all four of its tables with it -- and scene 2's own Spare had then been tuned thirty SHORT of its true size to bring scene 3 back into place. AND THAT IS WHY BOTH TOTALS LOOKED PERFECT THROUGHOUT. dgimage read 11,648 against 11,648 with no differing byte and minalloc matched to the paragraph, because nothing was missing or surplus -- thirty-two bytes were in the wrong PLACE. A TOTAL THAT BALANCES IS NOT A LAYOUT THAT MATCHES, and the two instruments that measure totals cannot tell the difference. Only dsmap can, and its report had been saying so for days: a shift of +32 over a bounded range with +0 either side is the exact signature of a misplaced block. WITH SCENE 1 CORRECTED THE OTHER TWO NUMBERS COULD BE READ RATHER THAN TUNED. Scene 2's Spare is 128 -- the gap from Pal's end at $A55A to Speed at $A5DA, read straight off two measured addresses -- AND 128 IS A FILE RECORD, the seventh in this target. It had been 98, a number that balanced. And two more bytes fall out at $A5DE: Index is a word at $A5DC and Key a byte at $A5E0, so two bytes between them are declared and untouched. That pair was invisible while every gap in the unit was being read against the wrong baseline. P5S2 ALSO NEEDED {$A-}: Key is one byte at $A5E0 and F begins at $A5E1, and with $A+ Turbo Pascal pushes a 128-byte record to the next word boundary and puts it at $A5E2, which is where ours was. One byte,