[[plan.investigation]]
name = "surplus-fpu-sites"
finding = "parts 003 and 006 each ship MORE x87 emulator traps than the 1994 binaries do -- three and two -- and the surplus was read for days as a unit compiled {$N+} that the original built {$N-}. It is not a switch on either part: every unit's {$N} already matches, and the surplus is two ordinary expressions that compute the same value more times than the original does."
seen_in = "TPART6"
state = "resolved"
resolution = "NEITHER PART HAD A SWITCH WRONG, and the class is worth the name it now has: the rebuild performed an operation the original had arranged not to perform twice. Localised with fpusites.py --diff, which diffs the two streams of trap NUMBERS rather than pairing our addresses against the original's segment map -- layout-independent, so it works on a part at 87 percent. PART 006, P6S1's BuildPath: the original stores Abs(Dx) and Abs(Dy) into Major and Minor and then tests THOSE TWO VARIABLES; the reconstruction tested Abs(Dy) >= Abs(Dx) and recomputed both. The branch sense fixes which way round the source names them -- the original pushes Major, then Minor, and skips the block on JB, which is `if Major <= Minor` -- and writing it that way took the part from 98 traps to the original's 96, with six bytes of code removed. PART 003, Tunnel_UpdateMotion: the degrees-to-radians conversion is a NESTED function at 1015:0708 in the original -- each call site pushes the six-byte Real and then BP, and the routine opens ENTER 6,0 and closes RET 8 -- and the reconstruction had `Angle * Pi / 180` inline in both statements, so the multiply and the divide were emitted twice instead of once. Extracting the function matched the count exactly and moved the coverage walk 86.6 to 87.1 percent. The unit's own comment had named 1015:0708 and said what it did all along, so the reading had been done and only the transcription had not. WHAT MAKES THIS WORTH RECORDING RATHER THAN JUST FIXING: on part 006 the coverage walk is BLIND to it. A bracket build was run for that reason -- the old expression and the new, nothing else in the tree moved -- and spans.py reported 9229 of 10160 aligned BOTH TIMES, byte for byte the same number, because the six extra bytes sat inside a stretch the walk had already given up on. The general form is the wiki observation operation-count-names-the-shape. NEITHER PART HAS BEEN RE-OBSERVED: both are fidelity fixes measured against the binaries, and part 006 removes work from a path the original does once per frame, so a watched run is still owed."

[[plan.investigation]]
name = "part5-dgroup-order"
finding = "part 005's initialised data differs in 5,182 of 11,648 bytes, first at $0002, and dgimage.py says it resynchronises at a shift of +4 -- which reads as one small block in the wrong place. The lead had been recorded and never followed."
seen_in = "TPART5"
state = "resolved"
resolution = "IT WAS THE USES CLAUSE, and the +4 was the whole of it wearing a disguise. The four bytes are MViewH and MViewW, two typed Word constants that P5S3 owns; the rebuild put them at the FRONT of the initialised region and the original puts them at the very END, at $2d16 and $2d18, immediately after P5S1's four clip bounds. Everything between is P5S1's 11,532-byte generated mesh table, in the right place in both builds and differing in 5,182 places purely because it was displaced by four bytes. TWO CANDIDATES, AND A BUILD SETTLED THEM. That the constants belong to P5S1 is REFUTED and the refutation is worth keeping: DEMOMATH.OBJ is linked with {$L} from P5S3 and its EXTRN resolves by PASCAL SCOPE in the unit that links it, so declaring MViewW anywhere else gives `Undefined external (MViewW)`. Their owner is therefore not in question and the ORDER OF THE UNITS was the only thing left. Naming the three scene units backwards -- `uses Crt, VGA, DemoVT, P5S3, P5S2, P5S1` -- took the initialised data from 5,182 bytes differing to TWO, the harness's own line terminator and nothing else. Declaring MViewH before MViewW inside P5S3 closed the last four. THE SEGMENT SIZES AGREE WITHOUT BEING ASKED, which is the independent check: under the reversed clause P5S1 comes out at 0x88 paragraphs where the original has 0x88, and the four units after the scenes match the original's 0x08, 0x14, 0x62 and 0x11 exactly. Under scene order the three scene units were laid down back to front. AND THE COVERAGE WALK REPORTED 10980 of 11440 BOTH TIMES -- the same number to the byte, for a build whose units were in reverse order. spans.py locates a segment by CONTENT, so a unit at the wrong segment number still matches, and the two-byte displacement errors inside it fall under its short-difference tolerance. dsmap.py did move, 47 references at +0 to 60, and the three large negative shifts it had been reporting are gone. The clause now carries the measurement as a comment so nobody tidies it back into scene order; the general form went into the wiki's dgroup-order-reverses-uses as its second example, which is where the claim that the walk corroborates this is now qualified. NOT RE-OBSERVED: no behaviour is expected to change, and part 005's residual slowness in the rotozoom setup is still carried by row 005 1096:0042."

[[plan.investigation]]
name = "part6-p6s3-setup"
finding = "part 006 sits at 90.8 percent and spanwhy traces 12 of its 18 spans back to three length changes inside P6S3, all of them in or downstream of Setup."
seen_in = "TPART6"
state = "resolved"
resolution = "THREE DEFECTS IN ONE ROUTINE AND ITS NEIGHBOUR, 90.8 to 95.6 percent -- part 006 is over the 95 target. ONE: SetDAC at 1118:0000 is HAND ASSEMBLER, not four Port[] writes. The original loads DX once as $03C8, does OUT, then INC DX and reuses it for all three components; Turbo Pascal emits MOV DX,imm for every constant port index and never emits INC DX, and it evaluates the value before the port where the original does the port first. 27 bytes against our 35, and the transcription is byte-identical including the 'neurosis.dat' literal that follows it. handasm.py reported `no evidence`, which is its honest answer for a 27-byte routine and not a refutation. TWO: Setup's frame is ENTER $484 and ours was $384. The original's touched slots are [BP-$02], [BP-$04], [BP-$404] and [BP-$484], and locals are allocated FIRST-DECLARED NEAREST BP -- proved on our own build, whose file record sat at [BP-$80] because it was declared first -- so the two counters come first and the file record LAST. Our block was in exactly the reverse order. The missing 256 bytes sit between J and Pal, and WHAT THEY ARE IS NOT DECIDABLE FROM THE BINARY: nothing reads the slot, so a 256-byte local and a 1024-byte Pal read 768 bytes at a time give the same frame, the same base addresses and the same push $0300. Written as a never-read local so that SizeOf(Pal) stays equal to the 768 the original pushes; the source says so. THREE: Pal is 256 THREE-BYTE RECORDS, not 768 bytes. The original addresses green and blue as [BX+DI-$403] and [BX+DI-$402] -- the component offset FOLDED INTO THE DISPLACEMENT, which is a record field. A flat Pal[I*3+1] cannot do that: TP emits INC AX and leaves the displacement at -$404. It also builds the index straight into DI where the flat form computes in AX and copies. Same 768 bytes. This is the same class as row 002 108b:1113, where part 002's palette was found to be 256 three-byte elements and part 002 scene 1's was not. NOT RE-OBSERVED. SetDAC is called 281 times per Setup and Overlay runs every frame, so this part has changed behaviourally-relevant code and the run owed under part6-confirm-r3 now covers it."

[[plan.investigation]]
name = "spans-config-missing-segments"
finding = "spans.toml's segment list for parts 001 and 003 disagrees with what the original files' own relocations say: each is missing one segment."
seen_in = "TPART3"
state = "resolved"
resolution = "BOTH OMISSIONS ARE TURBO PASCAL'S Crt, 1,568 bytes, FOLDED INTO A NEIGHBOURING USER SEGMENT. Part 003 was missing 1309, so 12f8 was measured as 1,840 bytes instead of 272; part 001 was missing 14d0, so 1491 was measured as 2,576 instead of 1,008. Read straight off each file's relocation targets, which name every segment the image refers to. Both rows added, and every part now agrees with its file. WHAT IT COST IS NOT THE HEADLINE NUMBER, and saying so matters more than the fix: part 003 moved 12127 to 12118 aligned and part 001 did not move at all, because spans.py locates a segment by content and had been aligning the Crt bytes inside the combined block anyway. The damage was to per-segment LENGTHS -- which is how it was found, segpair.py pairing the original's '073-paragraph VGA' against our 062-paragraph Crt. This is the drifted second copy the distrust list describes: it does not go quiet, it manufactures findings. Nothing in the reconstruction improved here."

