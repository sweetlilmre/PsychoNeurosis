resolution = "THE COLOUR TABLES ARE ONE-BASED, and the subscript fold is what says so. 88.1 to 89.0 percent. 1015:018d computes Band*BandSize + 1 into DI and folds +1 into the displacement, which is base $0002 minus a low bound of 1. A 0-based table gives DI = Band*BandSize and a displacement of 2, which is what ours emitted. TColourTable and RotTmp are array[1..N], every subscript shifted by one -- 99 of them -- and band b is then b*15+1..b*15+15, which is also how the fifteen unrolled moves read naturally. Worth 87 bytes. RotateBandsFine is now byte-identical for its whole first band except one displacement. A SECOND FINDING FROM THE SAME ROUTINE: the store went through [DI+$A7EF] where ours used [DI+$A7DB], and chasing that 20-byte gap gave this unit's variable ORDER, read straight off the addresses. 1015:088d pushes [$A7DE] then [$A7E0] as SetDisplayStart's two parameters, so PanX and PanY come FIRST; Angle's three words are $A7E2, $A7E4, $A7E6; Radius is $A7E8..$A7ED; and RotTmp[1] is at $A7F0. Ours had Angle and Radius first and RotTmp before them. Reordering was worth another 33 bytes and took the shift from +9 to -2. UNRESOLVED, AND THE RESIDUAL IS EXACTLY TWO BYTES. Our PanX lands at $A7DC where the original's is $A7DE, so this unit wants two more bytes BEFORE PanX, and it cannot simply be given them. Measured both placements: a Word below PanX fixed every address in the unit and pushed PART3_STARS' variables up by 2 -- its base was already right -- costing 569 bytes of the walk; a Word between Radius and RotTmp left the -2 untouched and cost the same 569. So the two bytes are a REDISTRIBUTION inside this unit rather than an addition: something declared here is two bytes larger than the original's. YOffset at 800 entries and PlaneOf at LogWidth are the candidates and NEITHER HAS BEEN CHECKED against the binary. That is the next step, and it comes before adding any declaration. The source carries this note at the var block. Not re-observed. The rotation runs