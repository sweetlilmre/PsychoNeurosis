resolution = "BOTH RESOLVED, and part 005 is at 100.0%. 1102:0082 was hand assembler (registers held across four tests, ADD BX,BX, and the long CMP AX,0 next to the short CMP BX,0) and 1096:034a was hand assembler proved by probe/MULSIGN.PAS -- eight spellings across three compiler releases, twenty-four builds, no match for CWD/IMUL/IDIV. Ours was also arithmetically WRONG there: MUL then CWD destroys the product's high half before IDIV. See part5-hand-asm-three."

[[plan.investigation]]
name = "part6-close"
finding = "PART 006 98.6 -> 99.3%, AND THE SPAN THAT HAD BEEN WRITTEN OFF AS UNFIXABLE WAS A DECLARATION ALL ALONG. 100f:0543 was recorded as `a REGISTER-ALLOCATION difference, deliberately left -- the original builds the palette index in DI, ours in AX then transfers; Pascal does not name the register`. That was wrong. It is the palette's TYPE: array[0..255, 0..2] of Byte rather than array[0..767], which puts the channel in a constant second subscript the compiler folds into the displacement instead of adding at run time -- and once the index is built the way a two-dimensional subscript builds it, the register follows. 29 bytes, and it closed to zero. THE LESSON IS THE MISATTRIBUTION: a difference blamed on the code generator's freedom was a difference in the source's types, and calling it unfixable stopped anyone looking for a year of sessions. THAT IS THE THIRD PALETTE IN ONE DAY -- part 004's ScenePal, part 005's P5S2 and this one -- all flat array[0..767] in ours and all two-dimensional in the original. It is this target's default shape for a 768-byte DAC buffer and should be assumed, not discovered a fourth time. AND P6S1's FONT IS THREE-DIMENSIONAL for the same reason, one dimension deeper. 1095:0649 reaches a glyph byte as ES:[DI-$2011] with DI built from Ch shifted left 8, Row shifted left 4 and Col added, and $2011 is 8,209 = 32*256 + 1*16 + 1 -- the three low bounds folded into one displacement. A flat index made the compiler subtract all three at run time. P6S4 HAD NO {$I-} EITHER, exactly as part 004's Lemmings unit did not: seven five-byte calls to the runtime's I/O check the original has none of. The part's other three scene units all carry the directive. Worth a sweep for units with no I directive at all. TWO SMALLER ONES. P6S2's Setup declares I, J, A and not I, A, J -- the first cell loop puts its inner counter at [BP-$84] and the shape loop multiplies [BP-$86] by eight, so both offsets are readable and neither is a guess. And a subscript needs PAR