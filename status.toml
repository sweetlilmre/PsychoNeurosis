[[plan.investigation]]
name = "part1-operand-order"
finding = "PART 001 96.2 -> 96.9% ON ONE TEXTUAL CHANGE, AND THE RULE BEHIND IT INVERTS THE INTUITION. Turbo Pascal evaluates the two operands of a binary operator RIGHT TO LEFT when both need the accumulator: it computes one, parks it in DX, computes the other into AX and adds. THE ONE IT PARKS IS THE OPERAND WRITTEN SECOND. 1012:0043 puts (Y + 20) * 40 into DX, so the row term is written SECOND and the source is `(X + 20) + (Y + 20) * BounceW` -- which is not how anyone writes a row-major subscript, and is what the bytes say. Ours had the multiply on the left, which is the natural way round and four bytes different at every one of the SIXTEEN index and value expressions in BuildLens: four quadrants of the lens table, index and value each, in both branches. Five separate fifteen-byte spans in the walk, one per quadrant plus the identity case. Rewriting all sixteen closed 163 bytes in one build. IT ONLY BITES ON compound + compound. A simple right operand -- a memory load or a constant -- is added in place with no reordering, so there is nothing to read; and a left-associating chain folds the trailing terms away, leaving only the first `+` to reorder. That is why subscripts and address arithmetic are where this lives. AND IT IS NOT THE ONLY CAUSE OF A REGISTER DIFFERENCE, which is the trap: a flat array where the original's is two-dimensional builds its index differently AND in a different register, and that is a TYPE difference. Check the addressing as well as the register -- a folded displacement against a run-time addition settles it. In the wiki as `The operand it evaluates first is the one written second`."
