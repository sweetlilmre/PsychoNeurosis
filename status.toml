resolution = "THREE DEFECTS IN ONE 72-BYTE ROUTINE, now BYTE-IDENTICAL, and part 003 is at 88.1 percent. Each was found by a bracket rather than an argument, and one of the brackets was a REGRESSION that located the truth. ONE: 1015:06bc reads a BYTE FROM MEMORY where a plain const would have folded into the instruction -- MOV AL,[$76B6] / XOR AH,AH / MUL [BP+4]. That address is ModeX's LogicalWidth, a Byte TYPED constant, and the XOR is its unsigned widening. Ours used CrtcOffset, a plain const, which folded to the literal 80. Both images already held 50 at $76B6 because the data layout was already right, so the fix was to reference the existing constant, not to declare a new one -- declaring one would have displaced everything after it. TWO: THE TERM ORDER, and the disassembly reads the wrong way round. The original computes X shr 2 FIRST, into CX, and multiplies second, so the obvious conclusion is that the shift is the LEFT operand. It is not: TP evaluates the SECOND operand of this addition first. Measured all three ways -- 12227 aligned before, 12224 with the shift written on the left, 12243 with it on the right. The three-byte REGRESSION is what proved the direction. THREE: the CRTC pair is HAND ASSEMBLER and the arithmetic is NOT, and two bytes drew the line. The original loads Addr into BX once and writes both halves as 16-bit OUT DX,AX, index in AL and data in AH; PortW with `$0C or (Hi(Addr) shl 8)` does emit the 16-bit OUT and then builds the word as MOV AL / XOR AH,AH / SHL AX,8 / OR AX,$000C, eleven bytes where the original spends four. But transcribing the WHOLE routine as assembler left exactly two bytes wrong -- 8B C8 against 89 C1 for MOV CX,AX, and 03 C1 against 01 C8 for ADD AX,CX -- both in the opening arithmetic and none in the tail. Opposite direction bits, same mnemonics: the compiler and BASM disagree, so those two bytes named the block boundary to the byte. A Pascal statement followed by an asm block at exactly that point is identical in all 72. Written up in the wiki as a new section of direction-bit-names-basm, because the page's ratio refuses to speak below eight qualifying operations and this decided it on two. NOT RE-OBSERVED. SetDisplayStart runs once per frame of scene 1, so this is behaviourally live code, but nothing about it should look different."

[[plan.investigation]]
