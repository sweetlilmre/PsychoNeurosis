[[plan.investigation]]
name = "part6-to-99"
finding = "PART 006 98.0% -> 98.2%, and segment 100f now has NO frame difference at all. Two findings, and the second is the recipe's static-link check paying again. Setup at 100f:03f8: ENTER $386 is 902 and it decomposes as 128 + 6 + 768. Only three slots plus the palette are referenced, so the 128 bytes NEAREST BP are declared and never read -- an unreferenced file record, the same thing P6S1's Load already has in the same position. First-declared is nearest BP, so the order is that record, then the three Integers at $82/$84/$86, then Pal at $386 -- the address this file already recorded for it. Declared with Pal first, Pal landed at [BP-$300] and the frame came out $306. LoadCel at 100f:00ac IS A NESTED PROCEDURE, and the call site says so: 100f:0112 pushes the slot then 100f:0114 pushes BP -- a STATIC LINK -- before the near call, and 100f:00f9 is RET 8, being four bytes of String pointer plus two of slot plus two of link. That also PLACES the parameters, because the link takes [BP+4]: Slot lands at [BP+6] and Name's offset at [BP+8], which is exactly the pair the routine reads. At unit level it was RET 6 with both parameters two bytes low. Nested inside LoadCels, plus the two unread bytes at [BP-$202] that bring ENTER to $202. AND ONE CHANGE KEPT DESPITE A FLAT MEASUREMENT, which needs saying because the standing rule is that neutral means unmeasured. Setup's palette loop indexes Pal with the counter at [BP-$82] -- 100f:0544 is MOV AL,[BP+DI-$386] after DI is built from [BP-$82] -- and [BP-$82] is the first-declared slot, so I is first and A and J follow. Our order had A there. The walk did not move for it. The difference from the neutral-means-unmeasured cases is that this is a DIRECT reading of the original's displacement rather than an inference from a total, so it is kept; but the walk's silence is recorded rather than glossed."
seen_in = "TPART6"
state = "resolved"
resolution = "PART 006 NOW HAS EXACTLY ONE FRAME DIFFERENCE LEFT, down from six, and the walk is flat at 98.2% for this last fix -- which is worth stating rather than hiding. P6S4's Setup at 11bb:0015: Pal's OWN ADDRESS places everything. It sits at [BP-$382] and is 768 bytes, so it ends at [BP-$83], leaving 130 bytes ABOVE it and 4 BELOW against ENTER $386's 902. First declared is nearest BP, so the 130 come first -- an unreferenced 128-byte file record and one Integer -- then Pal. That is the identical shape to P6S2's Setup, fixed earlier in the same batch, and to P6S1's Load: THREE routines in this part declare a file they never open. AND THE FOUR BYTES BELOW Pal ARE THE COMPILER'S. Declared as a LongInt the frame came out $38A, four too many, and framehist named it as a $38A surplus against a $386 shortfall -- an equal-and-opposite pair, which is exactly what its own guidance says is usually ONE routine rather than two defects. Removing the declaration and letting the four be a temporary gave $386. Same trap as part 007's function result: A SLOT THE ROUTINE USES IS NOT NECESSARILY A SLOT IT DECLARES, and that is now twice in two batches. A MIS-COMPARISON WORTH RECORDING so it is not repeated: I byte-compared what I thought was Setup's palette loop and read our counter as [BP-2] and our Pal as [BP-$404], which made no sense against declarations that were demonstrably right. The needle had matched a DIFFERENT routine -- several units in this part have a `SetRGB(I, Pal[I*3], ...)` loop and they share a byte pattern. Locating by content needs a needle that is unique, and a palette loop is not."

[[plan.investigation]]
name = "part6-last-81"
finding = "part 006 is at 98.2% and needs about 81 bytes for 99%. Its frames are done bar one and the remaining work is bodies. THE ONE FRAME: Whoosh at 1095:067d, ENTER $112 against our $114. Its nine declared words plus the String parameter's 256-byte copy come to 274 exactly, which IS the original's, so the two extra bytes are a temporary our body creates and the original's does not. Given the last two batches, look for it in an expression that stores an intermediate rather than in a declaration. THE SPANS, and they are small and scattered: 100f:0543 (29, in Setup's palette loop), 11bb:01b5 (20), 11bb:0096 (18), 11bb:01e8 (18), 1095:063c (16). That is 101 bytes in spans of 16 or more against 183 unaligned in total, so 82 bytes are in spans too small to list -- which means even fixing every listed span would not reach 99% on its own. 11bb:0096 IS PARTLY READ: it is Assign/Reset/Seek on the file at DS:$9654 with a palette buffer at [BP-$382] handed to something in segment 1ee, and a LongInt seek offset of 28 pushed as PUSH $1C / PUSH 0. Three spans in 11bb of 18-20 bytes each suggests one repeated shape rather than three problems."
seen_in = "TPART6"
state = "resolved"
resolution = "PART 006 98.2% -> 98.6%, and TWO of its three 11bb spans are gone: the font lookup now matches with ONE byte differing, and that byte is a jump displacement. THE FONT ARRAY IS THREE-DIMENSIONAL and its bounds are not the loop bounds. Three readings, each needed. FIRST, THE SHAPE. 11bb:01b5 is LES DI,[Font] followed by THREE separate adds -- ADD DI,AX / ADD DI,DX / ADD DI,CX -- which is what a three-subscript reference emits. Ours summed the terms into AX and added once, which is a one-dimensional subscript. SECOND, THE LOW BOUND, from the fold. 11bb:01bf is CMP BYTE PTR ES:[DI-$2F53], so 12,115 is folded into the displacement, and for array[L.., 1..21, 1..18] the fold is L * 378 + 18 + 1. That gives L * 378 = 12,096 and L = 32 -- the space character, which is what part 004's font array uses for the SAME font. Written as a 0-based array with `- 12115` in the subscript, Borland emits a runtime SUB AX,$2F53 instead, because it does not fold a constant across an expression containing variables. THIRD, AND THIS ONE COST AN EXTRA BUILD: THE ARRAY's DIMENSIONS ARE NOT THE LOOP BOUNDS. 11bb:01b1 multiplies by $17A (378) and 11bb:01cb by $12 (18), so the glyph is 21 columns of 18. But the loops walk 20 and 19 -- 11bb:021d counts J to $14 and 11bb:0233 wraps the row at $14 -- so the code steps outside the declared glyph on BOTH axes and, with range checking off, reads into the next glyph. Declaring the array from the loop constants, which is the obvious thing, gave strides of 380 and 19 and put every lookup two bytes further on per character. It also gained 45 bytes on the walk anyway, because the SHAPE was right even while the multipliers were wrong -- a reminder that a partial gain is not a finished reading."

[[plan.investigation]]
name = "part6-last-42"
finding = "part 006 is at 98.6% and needs about 42 bytes. Three spans are left and two of them are displacement noise rather than wrong code. 11bb:0096 (18 bytes) is SetPalette768(@Pal) followed by Close(F), and the sequence already matches -- the differing bytes are the far-call target into the VGA unit (segment 1ee at offset $212 in the original) and the DS address of the file record at $9654. Both are allowed-difference classes that the walk does not forgive when they are dense. 1095:063c (16 bytes) is unread. 100f:0543 (29 bytes) is Setup's palette loop and IS worth reading, but note the trap: I byte-compared it once by searching for the Pal[I*3] fetch and matched a DIFFERENT routine, because several units in this part share that byte pattern. Locate it by the ENTER $386 prologue instead, which is unique to two routines and can be told apart by what follows. AND ONE FRAME REMAINS: Whoosh at 1095:067d, ENTER $112 against our $114. Its nine declared words plus the String parameter's 256-byte copy are 274, which IS the original's, so the two extra bytes are a temporary our body creates. Given this batch and the last two, look for an expression that stores an intermediate -- and remember the array-dimension lesson: check the multipliers, not just the shape."
seen_in = "TPART6"
state = "resolved"
resolution = "PART 005 97.3% (+2 bytes) and its remaining frame difference is now the two-byte temporary above. P5S3's Setup at 1102:02d1 had NO FRAME AT ALL where the original opens ENTER $82 -- 130 bytes, and not one of them is referenced anywhere in the routine. 128 + 2 is a file record and a word, and this is the FOURTH routine in the target to declare a file it never opens: P6S1's Load, P6S2's Setup, P6S4's Setup and now this. The file it actually uses is the global at DS:$A984 that 1102:02ed pushes. AND PART 006's LAST READABLE SPAN IS A REGISTER-ALLOCATION DIFFERENCE, which is where I stopped. Setup's palette loop at 100f:0543: the original builds the index in DI directly -- MOV DI,[BP-$82] / MOV SI,DI / SHL DI,1 / ADD DI,SI -- and ours builds it in AX and then transfers, MOV AX,[BP-$82] / ... / MOV DI,AX. Two bytes per access, three accesses. The displacements and the -$386 base already match, so this is not a declaration or an expression difference; it is which register the code generator chose, and Pascal does not name that. Recorded rather than chased. Locating it needed care and the note is worth keeping: searching for the Pal[I*3] fetch matched the WRONG routine, because several units in the part share that byte pattern. Pairing the three ENTER $386 sites by byte agreement over their first 512 bytes found the right one."

[[plan.investigation]]
name = "two-byte-temp"
finding = "THREE ROUTINES IN TWO PARTS ARE EXACTLY TWO BYTES OF FRAME TOO BIG, and in all three our declarations total the original's figure exactly -- so the two bytes are a COMPILER TEMPORARY our body creates and the original's does not. This is one investigation, not three, and it is worth a probe rather than more reading. P5S2's Shatter at 1096:0042: ENTER $26 against our $28. Its seventeen locals sum to 37, which rounds to 38 = $26 exactly, so nothing is missing or mistyped. P6S1's Whoosh at 1095:067d: ENTER $112 against our $114. Nine declared words plus the String parameter's 256-byte copy are 274 = $112 exactly. P7S1's UpCaseStr at 100f:06f7: ENTER $104 against our $106. A 256-byte String copy plus I and L are 260 = $104 exactly, and the loop is NOT the cause -- 100f:071f compares against L directly, so `for I := 1 to L` over a simple local needs no limit temporary. WHAT IS ALREADY RULED OUT: the for-loop limit (measured in UpCaseStr), the declaration order (checked in all three), and a shared construct -- Shatter has `(X1-X0) * T div Denom` expressions and Whoosh has `Length(S)`, with nothing obviously in common. HOW TO SETTLE IT: put the candidate constructs in probe/ and read the frames. TP7's temporaries that are two bytes wide are few, and one build per candidate prices it -- the same loop that settled the LongInt function result in part 007 after three wrong guesses. Do that before touching any of the three bodies; guessing has cost a build each time."
seen_in = "TPART5"
state = "resolved"
resolution = "THE PROBE SETTLED IT: A `for` LOOP COSTS TWO BYTES OF FRAME FOR ITS LIMIT, and it costs them whether the limit is a global OR a local. probe/TWOBYTE.PAS measures it directly -- a routine with `Pad`, I and L, looping `for I := 1 to L`, comes out at 36 where its declarations total 34. So a two-byte slot beyond what the declarations account for is very often a `for` and not a missing variable. ALSO MEASURED, and all FREE: `(a-b)*c div d + e`, a `case` on a variable, an expression used as an array subscript, a Byte in a word expression, and nested function calls. A `with` over an array element costs FOUR, which is the record's address. WHAT IT FIXED. P7S1's UpCaseStr declared BOTH an L and the loop over it, so its frame was 256 + 2 + 2 + 2. The original's three slots are the String copy at [BP-$100], I at [BP-$102] and the loop's own temporary at [BP-$104] -- there is NO L. Written as `for I := 1 to Length(S)` the frame came out $104 and the routine matched to ONE byte. AND THAT LAST BYTE WAS ANOTHER FAR. `LDS SI,[BP+6]` against our `[BP+4]`, and 100f:0763 is RETF 4. UpCaseStr is the THIRD routine in this unit declared near that is far, after ReadTimer and WaitTicks. With the directive it matches except the two RTL call targets. THE PROBE DESIGN IS WORTH REUSING AND THE FIRST ATTEMPT WAS WRONG. I scanned the compiled unit for `ENTER` byte patterns and mapped them to routines BY ORDER, which mis-paired -- data bytes read as C8 xx yy 00, and anchoring on a preceding return did not fix it. The rewrite gives each routine a DISTINCT pad size, so the frame identifies the routine and a temporary shows as +2 on a known base. Self-identifying output beats a scan whose ordering you have to trust. Part 007 reads 99.0% against 99.3% before this batch, and still meets the target. The eleven bytes went on UpCaseStr's callers, which now use the same-segment far-call form; the routine itself went from two differences to none beyond the allowed classes."

[[plan.investigation]]
name = "apply-for-temp"
finding = "APPLY THE for-LOOP TEMPORARY FINDING to the two routines it has not been tried on. A `for` costs two bytes of frame for its limit, measured in probe/TWOBYTE.PAS, so a routine whose frame exceeds its declarations by exactly two usually has a `for` -- and one whose frame MATCHES its declarations while ours is two over has declared a limit variable the original left to the temporary. P6S1's Whoosh at 1095:067d, ENTER $112 against our $114: our nine declared words plus the 256-byte String copy come to 274, which IS $112, so on the new reading one of those nine is the loop's temporary rather than a declaration. Len at [BP-$112] is the candidate -- it is the deepest slot and it is what a limit temporary would be -- but the original DOES reference [BP-$112], so check whether that reference is the loop's own compare before removing the declaration. P5S2's Shatter at 1096:0042, ENTER $26 against our $28: seventeen locals sum to 38 = $26 exactly, so again one of them is a temporary. Limit at [BP-$25] is the candidate and the original does NOT reference it, which is the stronger case of the two. Do Shatter first: an unreferenced deepest slot that we declare and the original spends on a loop temporary is exactly the shape the probe describes."
seen_in = "TPART5"
state = "resolved"
resolution = "THE for-TEMPORARY FINDING PAID ON BOTH ROUTINES AND A THIRD BESIDES. PART 006 NOW HAS ZERO FRAME DIFFERENCES IN EVERY SEGMENT, and part 005 has one. Part 005 97.3% -> 97.4%. P5S2's Shatter: `Limit := Count; for I := 1 to Limit` paid for the variable AND the loop's temporary, giving $28 against the original's $26. The original never reads a slot at [BP-$25]. Written `for I := 1 to Count` the sixteen remaining locals sum to 36 and the temporary makes 38. +13 bytes on the walk. P6S1's Whoosh: [BP-$112] IS the loop's temporary and not a declared Len -- 1095:06c6 stores the length there and 1095:06cd compares against the same slot, which is store-then-compare, what a `for` does with its limit. Dropping Len and looping over Length(S) matched the frame. That is the distinction the previous session could not make: the original DOES reference [BP-$112], so the reference alone did not settle whether it was a declaration -- the store-then-compare PAIR is what settles it. P5S1's HeightFromMap, which was not on the list: ENTER $04 with only [BP+4] and [BP-2] read, so two bytes are declared and never touched. AND IT IS NOT A LOOP TEMPORARY -- 100e:05c8 compares [BP-2] against the constant $3FF directly, and a constant limit needs no temporary, which is the other half of what the probe measured. So the same instrument that adds a slot in one routine rules one out in another."

[[plan.investigation]]
name = "part5-last-frame"
finding = "PART 006's FRAMES ARE COMPLETE -- framehist reports zero differing frame sizes across all seven segments -- so everything left in it is bodies, and it needs about 42 bytes for 99%. Its three remaining spans: 100f:0543 (29), which is a REGISTER-ALLOCATION difference and was deliberately left (the original builds the palette index in DI directly, ours in AX then transfers; the displacements and the folded base already match and Pascal does not name the register); 11bb:0096 (18), which is SetPalette768 followed by Close and differs only in the far-call target and the file record's DS address; and 1095:063c (16), unread. So part 006 may not reach 99% without addressing displacement noise, and that is a different kind of work from everything in this batch. PART 005 HAS ONE FRAME LEFT, $102 MISSING, and prologue.py does not report it in any of the seven segments -- so it belongs to a routine the tool lists as `unproven, nothing calls this` or one outside the segment bounds. 258 is a String parameter's 256-byte copy plus two, so look for a routine taking a String that we have as taking something else, or one we have not written. framehist found it; prologue cannot name it. That pair of tools disagreeing IS the signal -- it means the routine exists in the original and has no counterpart of ours confident enough to pair."
