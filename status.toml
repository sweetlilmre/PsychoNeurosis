resolution = "TWO DEFECTS, 87.1 to 87.8 percent, and the first is a class that applies to every part. ONE, AND IT IS SYSTEMATIC: THE ORIGINAL GIVES EVERY UNIT AN EMPTY INITIALISATION SECTION. A Turbo Pascal program opens with one far call per unit that has one, in reverse link order, and the original's chain for this part runs thirteen calls before the real body starts at 1000:0041. Ours ran seven, because six units ended with a bare `end.` and TP then emits neither the chain entry nor the five-byte stub -- PUSH BP / MOV BP,SP / LEAVE / RETF -- that sits at the END of the unit's own segment and IS inside the compared range. Part3Tunnel's is at 1015:0a26. Adding `begin end.` to the six units was worth 36 bytes, which is small and exactly the predicted size, so the mechanism is confirmed rather than merely plausible. Swept across every part: only part 002 still has one unit short, and elsewhere ours EXCEEDS the original, which is the harness's own units and not a defect. THE CHAIN IS ALSO A FREE AND EXACT READING OF THE LINK ORDER, better than any content matching: it needs no anchor and no scoring. For this part it gives Tunnel, Stars, Morph, the 1192 unit, Globe, Blocks, Waves, Sprites, VGA, Crt, DemoVT -- which is the segment addresses exactly, so part 003's order was already right and an earlier guess that it was reversed is REFUTED. TWO: Tunnel_UploadPalette at 1015:0000 is HAND ASSEMBLER and ours was four Port[] writes in a for loop. Three signals TP's code generator does not produce: LOOP at 1015:0049; the 8-bit pointer arithmetic ADD BL,Ctr / ADC BH,0, adding a byte index into the low half of an offset and carrying by hand; and the three table addresses held in LOCALS rather than folded into each reference. The frame is ENTER $0A with a byte at [BP-2] and words at [BP-5], [BP-7], [BP-9], leaving [BP-1], [BP-3] and [BP-10] untouched -- three bytes the original declared and never read, declared here too because omitting them puts every slot after them at the wrong offset. WHAT they were is not recoverable; that they exist, and exactly where, is. The transcription closed the whole 73-byte span. WHAT IS LEFT: 997 bytes to 95 percent, and spanwhy puts the weight on three length changes -- 1015:06bc with nine spans, 10b8:0585 with five, 1015:018d with five. Not re-observed; UploadPalette runs once per scene and the init stubs do nothing, so no behaviour should have changed."

[[plan.investigation]]
name = "part3-setdisplaystart"
finding = "part 003's largest remaining cause is 1015:06bc, which spanwhy attributes nine spans to -- a length change inside SetDisplayStart at 1015:06b0."
seen_in = "TPART3"
