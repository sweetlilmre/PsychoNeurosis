d it is the next investigation, part1-unit-sizes: -23530 for this unit's whole block, then +272 at $AB54 and +368 at $ACEB. Since DGROUP runs backwards down the uses clause, this unit's block starting 23530 bytes too low says the units BELOW it there -- the other four scene units -- are collectively that much too small. 23530 bytes is a buffer, not a variable."

