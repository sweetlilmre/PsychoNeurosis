# This project's answers to the kit's questions. Read by kit/tools/project.py,
# and by nothing else.
#
# WHAT BELONGS HERE: what somebody READ. Where this repository keeps things,
# and the facts a person took out of the target's binaries once -- a segment
# list from a unit header, the paragraph a disassembler calls the start of an
# image.
#
# WHAT DOES NOT: anything MEASURED. Coverage, byte-match lengths, observations
# and rungs live in the status register, where the ratchet guards them. A
# measured number in a config file is a number that goes stale quietly, and
# this project has the scar: a coverage number pasted into a documented command
# line sat two below the truth.
#
# Machine-specific paths do not belong here either -- they may never appear in
# a committed file. They go in kit.local.toml, which git ignores and which
# overrides this file key by key.
#
# A person does not hand-write this file. The kit's setup wizard writes it.

[layout]
# Where this repository keeps things, relative to the directory holding this
# file. Every program in the kit takes these as an argument too, and an
# explicit argument always wins.
src      = "src"                       # the Pascal sources under reconstruction
wiki     = "kit/wiki"                  # the field manual
register  = "status.toml"              # the status register: the ratchet, the observations, the plan
exempt   = "src/asm/shared-exempt.txt" # assembler duplicated between units that cannot become one text
build    = "build"                     # where a build stages and leaves its output
built    = "run"                       # where a finished harness is installed
# Only OUR harnesses. `run/` also holds copies of the 1994 binaries so the
# demo can be run side by side, and comparing an original against itself
# passes trivially and proves nothing.
built_pattern = "TP*.EXE"

[target]
# Facts about the thing being reverse engineered, read out of it by a person.

# The paragraph the disassembly calls the start of the load image. Ghidra was
# given this base for every part of this demo, so every address in the notes,
# in the @asm markers and in the wiki's examples is relative to it.
first_para = 0x1000

# WHICH file each part is measured against, and it is not always the plain one.
# `_fpu` variants are THIS PROJECT'S disassembly aid -- the CD 3x x87-emulator
# traps rewritten to raw 9B+ESC so a disassembler can decode them -- not 1994
# release variants. Measuring a routine that touches the x87 against the plain
# file shows every FPU site as a difference; measuring against the patched one
# shows them as tolerated holes. Which to use is a decision about the
# measurement, so it is stated here rather than buried in a tool.
[target.original]
"000" = "work/split/NEUROSIS_000.exe"
"001" = "work/split/NEUROSIS_001_fpu.exe"
"002" = "work/split/NEUROSIS_002_fpu.exe"
"003" = "work/split/NEUROSIS_003_fpu.exe"
"004" = "work/split/NEUROSIS_004.exe"
"005" = "work/split/NEUROSIS_005_fpu.exe"
"006" = "work/split/NEUROSIS_006_fpu.exe"
"007" = "work/split/NEUROSIS_007_fpu.exe"

[census]
# Directories holding scripts, for the retirement census. The sibling
# repository's root is machine-specific and lives in kit.local.toml.
roots = ["tools", "kit/tools"]
# The table itself is this project's data -- a list of THIS pair of repos'
# scripts -- so it lives here and not beside the tool that reads it.
table = "docs/census.toml"

[encaudit]
# Where to look for text I/O that leaves the encoding to the locale. This was a
# constant inside the tool naming one repository's folders; the folders it named
# have since been emptied by the migration, and the kit's own scripts were never
# scanned by it at all.
dirs = ["tools", "kit/tools", "kit/tools/substrate", "kit/tools/pascal", "kit/tools/wikitools"]

[undeclared]
# Units whose exported names any other unit may use without declaring them --
# this demo's two shared units. It was a constant naming VGA.PAS and DEMOVT.PAS
# inside the tool.
shared = ["VGA.PAS", "DEMOVT.PAS"]
# Which sources are worth scanning. PART*.PAS is this demo's naming and nobody
# else's; a project with no convention scans everything.
scan = "PART*.PAS"
