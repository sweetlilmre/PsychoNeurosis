# This project's answers to the kit's questions. Read by kit/tools/project.py,
# and by nothing else.
#
# WHAT BELONGS HERE: what somebody READ. Where this repository keeps things,
# and the facts a person took out of the target's binaries once -- a segment
# list from a unit header, the paragraph a disassembler calls the start of an
# image.
#
# WHAT DOES NOT: anything MEASURED. Coverage, byte-match lengths, observations
# and rungs live in the status register, where the ratchet guards them. A
# measured number in a config file is a number that goes stale quietly, and
# this project has the scar: a coverage number pasted into a documented command
# line sat two below the truth.
#
# Machine-specific paths do not belong here either -- they may never appear in
# a committed file. They go in kit.local.toml, which git ignores and which
# overrides this file key by key.
#
# A person does not hand-write this file. The kit's setup wizard writes it.

[layout]
# Where this repository keeps things, relative to the directory holding this
# file. Every program in the kit takes these as an argument too, and an
# explicit argument always wins.
src      = "src"                       # the Pascal sources under reconstruction
wiki     = "kit/wiki"                  # the field manual
register  = "status.toml"              # the status register: the ratchet, the observations, the plan
exempt   = "src/asm/shared-exempt.txt" # assembler duplicated between units that cannot become one text
includes = "src/asm"                   # the shared assembler includes, compared against the units
probes   = "probe"                     # single-question units a compiler answers; probecheck.py re-runs them
# WITHOUT `includes` the duplicate check has a hole where its own fix
# lives: a marker followed by {$I} is skipped as shared, so an include body
# is compared against nothing and a unit holding its own copy pairs with
# nobody. P3MORPH.SetPalette768 sat in the exempt file for weeks with an
# exemption that could not fail.
build    = "build"                     # where a build stages the sources it was GIVEN
output   = "build/BIN"                # and where it puts what it MADE: .OBJ .TPU .MAP .EXE
# The split is build.toml's `[stage] output = "BIN"`. Every instrument that reads a
# PRODUCT resolves it through project.products(); the ones that read a staged SOURCE
# still use `build`, which is why these are two answers and not one.
built    = "run"                       # where a finished harness is installed
# Only OUR harnesses. `run/` also holds copies of the 1994 binaries so the
# demo can be run side by side, and comparing an original against itself
# passes trivially and proves nothing.
# BOTH, and in this order: the scene harnesses and the real per-part
# programs. NEUR*.EXE was missing while every part became a program of
# its own, so ten routines were being located in STALE TPART*.EXE files
# from builds that no longer run -- locks held up by binaries nothing
# produces. Never add a pattern that matches the ORIGINALS in here: a
# directory of originals passes against itself and proves nothing.
# EXPLICIT, not a glob, and that is the whole point now. Our builds carry the
# ORIGINALS' names, so "NEUROSIS.00*" would also match NEUROSIS.008 -- DemoVT,
# third-party, which this reconstruction does not build and whose bytes no
# instrument here should be locating routines in. A glob can include but not
# exclude, so the nine we do build are listed.
built_pattern = [
  "TP*.EXE",                           # the scene harnesses
  "NEUROSIS.000", "NEUROSIS.001", "NEUROSIS.002", "NEUROSIS.003",
  "NEUROSIS.004", "NEUROSIS.005", "NEUROSIS.006", "NEUROSIS.007",
  "NEUROSIS.009",                      # NOT .008 -- see above
  "PSYCHO.EXE",
]

# This tree is [re]-tagged, so tagcheck.py gates on it in the session list.
# Tag as you WRITE -- more than half the apparatus carries no mechanical tell,
# so the check cannot find what you did not mark.
tagged   = true

[target]
# Facts about the thing being reverse engineered, read out of it by a person.

# The paragraph the disassembly calls the start of the load image. Ghidra was
# given this base for every part of this demo, so every address in the notes,
# in the @asm markers and in the wiki's examples is relative to it.
first_para = 0x1000

# WHICH file each part is measured against, and it is not always the plain one.
# `_fpu` variants are THIS PROJECT'S disassembly aid -- the CD 3x x87-emulator
# traps rewritten to raw 9B+ESC so a disassembler can decode them -- not 1994
# release variants. Measuring a routine that touches the x87 against the plain
# file shows every FPU site as a difference; measuring against the patched one
# shows them as tolerated holes. Which to use is a decision about the
# measurement, so it is stated here rather than buried in a tool.
[target.original]
"000" = "work/split/NEUROSIS_000.exe"
"001" = "work/split/NEUROSIS_001_fpu.exe"
"002" = "work/split/NEUROSIS_002_fpu.exe"
"003" = "work/split/NEUROSIS_003_fpu.exe"
"004" = "work/split/NEUROSIS_004.exe"
"005" = "work/split/NEUROSIS_005_fpu.exe"
"006" = "work/split/NEUROSIS_006_fpu.exe"
"007" = "work/split/NEUROSIS_007_fpu.exe"
# 009 is the end screen. It was missing from this table until #50, and the gap
# showed up the moment a tool that had its own hardcoded path started reading
# this one instead -- that tool covered nine parts and this covered eight.
# There is deliberately no 008: it is DemoVT, third-party, and reconstructed in
# the sibling repository.
"009" = "work/split/NEUROSIS_009.exe"

# THE LAUNCHER. Not a split part -- it is a whole program of its own, which is
# why it is keyed by name rather than by a three-digit number and why nothing
# carved it out of the release. Its absence here was invisible while the
# layout config could not answer per part at all; once dgroup could measure
# nine of the ten it named the tenth as the gap.
#
# bin/PSYCHO.EXE rather than work/split/PSYCHO_EXE.exe -- the two files are
# byte-for-byte the same, and this is the path the guarded [artefact."TPSYCHO"]
# row already compares against. Two names for one original is how they drift.
psycho = "bin/PSYCHO.EXE"

# WHICH ORIGINAL A COVERAGE WALK USES, and it is NOT the table above. That one
# names the trap-rewritten copies where they exist, so a per-routine check reads
# an x87 site as a tolerated hole. A walk over every byte must use the SHIPPED
# bytes: our build carries the traps exactly as the release does, so measuring
# against the rewritten copy would show a two-byte hole at every FPU op and
# drown an x87-heavy region in noise. Two questions, two answers.
[target.release]
"000" = "work/split/NEUROSIS_000.exe"
"001" = "work/split/NEUROSIS_001.exe"
"002" = "work/split/NEUROSIS_002.exe"
"003" = "work/split/NEUROSIS_003.exe"
"004" = "work/split/NEUROSIS_004.exe"
"005" = "work/split/NEUROSIS_005.exe"
"006" = "work/split/NEUROSIS_006.exe"
"007" = "work/split/NEUROSIS_007.exe"
"009" = "work/split/NEUROSIS_009.exe"
# The launcher is not a NEUROSIS.NNN part, but it IS a rebuild this project
# measures -- TPSYCHO is byte-identical to it and artefact.py holds it at R7 --
# so the coverage walk needs a path for it like any other target. Release only:
# spans.py reads this table and nothing reads an "original" for the launcher.
"psycho" = "work/split/PSYCHO_EXE.exe"

[encaudit]
# Where to look for text I/O that leaves the encoding to the locale. This was a
# constant inside the tool naming one repository's folders; the folders it named
# have since been emptied by the migration, and the kit's own scripts were never
# scanned by it at all.
dirs = ["tools", "kit/tools", "kit/tools/substrate", "kit/tools/pascal", "kit/tools/wikitools"]

[undeclared]
# Units whose exported names any other unit may use without declaring them --
# this demo's two shared units. It was a constant naming VGA.PAS and DEMOVT.PAS
# inside the tool.
shared = ["VGA.PAS", "DEMOVT.PAS"]
# Which sources are worth scanning. PART*.PAS is this demo's naming and nobody
# else's; a project with no convention scans everything.
scan = "PART*.PAS"
