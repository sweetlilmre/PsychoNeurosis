# The census table: every script in both repos, and where it is in its
# retirement. Read by toolkit/census.py.
#
# The originals in tools/ and in the sibling repo are FROZEN and keep
# working. The toolkit is built beside them by copy and adjust. Once a
# toolkit tool supersedes an original, the original is archived -- so
# "never refactor the originals" is transitional, not permanent.
#
# No machine path appears here. The sibling repo's location is passed on
# the command line or set in the untracked local config.

