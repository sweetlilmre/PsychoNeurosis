# How this target is built. Read by kit/tools/pascal/build.py, which holds the
# method; everything here is this demo's own data.
#
# GENERATED from tools/dosbox/dosbuild.py on 23 Aug 2026 by parsing it, not by
# transcribing it -- forty name rows copied by hand is how a config drifts from
# the script it replaces on its first day.
#
# NO MACHINE PATHS. The DOSBox-X executable, the drive C: image and the
# compiler's own location live in kit.local.toml, which git ignores.

src     = "src"
build   = "build"
title   = "psycho build"
drive   = "D"
log     = "D:\\BUILD.LOG"
timeout = 180
lint    = "kit/tools/pascal/paslint.py"

[compiler]
# TP 7.00, NOT 7.01, AND IT IS MEASURED. The two installs are told apart by
# TURBO.TPL, which the Borland patch notes size at 48,432 for 7.00 and 48,464
# for 7.01: C:\TP700 is the former and C:\TP the latter. Building against 7.00
# makes the runtime's coprocessor block match the original byte for byte --
# DS-relative $2FFA onward, where 7.01 inserts PUSH SP / POP DX / CMP DX,SP /
# JNE, an 8086 check the 1994 binaries do not carry. Part 005 goes to 11,440 of
# 11,440 with NO unaligned byte at all, part 001 to 21,257 and part 006 to
# 10,124, and all three byte-identical artefacts still hold.
#
# The size identifies the VERSION and NOT the patch state -- an in-place patch
# need not change it -- so "unpatched" is not claimed here. What is claimed is
# 7.00 over 7.01, and that is what the bytes say.
default = "tp700"

# THE ENTRY NAMES MIRROR THE INSTALL DIRECTORIES -- tp600, tp601, tp700, tp701
# against C:\TP600, C:\TP601, C:\TP700, C:\TP701 -- because "tp7" meaning 7.01
# while "tp700" meant 7.00 was a trap waiting to be fallen into. The `dialect`
# values below are NOT these names: they stay tp6 and tp7, because a dialect
# selects a source transform and there are only two of those.
#
# THE TP6 ENTRIES CARRY NO /U, DELIBERATELY: each of those installs' own
# BIN\TPC.CFG holds its unit path, and that is where it belongs. The rename left
# those files pointing at the old directories -- TP600's at C:\TP6, TP601's at
# C:\TP61 -- and the maintainer is correcting them at the source rather than
# having this file work around them.
[compiler.tp701]
# 7.01. KEPT FOR COMPARISON, NOT FOR BUILDING: its runtime carries the 8086
# check described above and its System block does not match the original's.
# The switch line is tp700's, with only the unit path changed; the notes that
# explain it live there, on the entry that actually builds the demo.
dialect  = "tp7"
binpath  = "C:\\TP701\\BIN"
switches = "/ED: /UD:;C:\\TP701\\UNITS /ID:;D:\\GEN /$S- /GD"

[compiler.tp700]
# THE ONE THE DEMO IS BUILT WITH. See the [compiler] note above for the
# evidence that it is 7.00 and not 7.01.
dialect = "tp7"
binpath = "C:\\TP700\\BIN"
# /E<dir>  where the .EXE goes         /U<dirs> where to LOOK for units
# /I<dirs> where {$I} includes live    /$S-     STACK CHECKING OFF
#
# /$S- is load-bearing and its absence does not fail. TP7 defaults stack
# checking ON, and with it on every framed procedure -- INCLUDING an
# `assembler` one -- opens with a seven-byte XOR AX,AX / CALLF before the body.
# The demo was built with it off. Leaving the default made every hand-
# transcribed routine differ from the binary in its opening bytes.
#
# There is no /D output switch: /D is conditional DEFINES, and giving it a path
# is what produced "Error 130: Error in initial conditional defines".
#
# No /$E-, deliberately. The _fpu originals carry raw 9B+ESC where TP7 emits
# CD 3x emulator interrupts, but that is a POST-BUILD PATCH rather than a
# compile option, and dropping $E risks an unhandled INT 34h on any path the
# RTL does not patch.
# /GD MAKES TPC WRITE A MAP, AND IT ANSWERS WHAT WE HAD BEEN INFERRING. Every
# layout hunt here read our own code and data addresses out of the disassembly
# -- which is how one of them mis-decoded a runtime call operand as an `rcr`
# instruction, and another produced four contradictory shift deltas from a
# single build. The compiler knows the answers. /GD writes build/*.MAP with
# every segment's start, stop and length and every public symbol's address:
# P1Star's routines come out at 02C7:0000, 00C0 and 00F1, which are the
# original's 12b2 offsets exactly.
#
# It does NOT change the EXE -- all 32 targets and all seven walks are
# identical with it on -- and build/ is git-ignored, so the maps cost nothing.
# CODE publics only, not unit variables, so a data hunt works from segment
# LENGTHS rather than symbol names.
switches = "/ED: /UD:;C:\\TP700\\UNITS /ID:;D:\\GEN /$S- /GD"

[compiler.tp600]
# For SETTLING a compiler-version question, not for building the demo.
# TP6's install is FLAT: TPC.EXE sits in C:\TP600, not a BIN
# subdirectory, and its own TPC.CFG beside it carries the unit path.
dialect = "tp6"
switches = "/ED: /ID:;D:\\GEN /$S- /$X+ /$G+"

[compiler.tp601]
dialect = "tp6"
switches = "/ED: /ID:;D:\\GEN /$S- /$X+ /$G+"

[assembler]
# TP7's built-in assembler stops at the 286 ({$G+} is documented as "Generate
# 80286 Code Switch"), so the demo's 386 fixed-point maths comes in through
# {$L DEMOMATH.OBJ} and that object is assembled first. /ML keeps the PUBLIC
# names case-sensitive, which is how TPC matches them to Pascal identifiers.
flags = "/ML /Z"

[order]
# Derived from the staged sources' own `uses` clauses. A hardcoded dependency
# list gave "Error 15: File not found" the moment a part arrived that used
# something not on it, and NAMES order stopped being a build order the day
# TPART0 (uses Detect) was added above DETECT.PAS.
mode = "uses"
list = [
  "VIDMODE.PAS",
  "PSYCHO.PAS",
  "BYEBYE.PAS",
  "STARTUP.PAS",
  "DETECT.PAS",
  "VGA.PAS",
  "DEMOVT.PAS",
  "MODEX.PAS",
  "FIXMATH.PAS",
  "P1S1.PAS",
  "P1S2.PAS",
  "P1S3.PAS",
  "P1STAR.PAS",
  "P1S4.PAS",
  "P1S5.PAS",
  "NEUR1.PAS",
  "P2VIEW.PAS",
  "P2S1.PAS",
  "P2S2.PAS",
  "NEUR2.PAS",
  "PART3_TUNNEL.PAS",
  "PART3_STARS.PAS",
  "PART3_MORPH.PAS",
  "PART3_GLOBE.PAS",
  "PART3_BLOCKS.PAS",
  "PART3_WAVES.PAS",
  "PART3_SPRITES.PAS",
  "NEUR3.PAS",
  "PART4_LEMMINGS.PAS",
  "NEUR4.PAS",
  "P5S1.PAS",
  "P5S2.PAS",
  "P5S3.PAS",
  "NEUR5.PAS",
  "P6S1.PAS",
  "P6S2.PAS",
  "P6S3.PAS",
  "P6S4.PAS",
  "NEUR6.PAS",
  "P7S1.PAS",
  "NEUR7.PAS",
]

[stage]
# Pascal sources here are 7-bit; anything else is a mistake worth seeing.
encoding = "ascii"
# The generated test harnesses already carry conforming 8.3 names and matching
# unit identifiers, so they map to themselves and adding one needs no edit here.
identity = ["TP*.PAS"]
# The 386 maths module and its include go in the build ROOT, not GEN: TASM
# resolves INCLUDE relative to the current directory, and TPC looks for the
# .OBJ next to the unit that links it.
# The external harness rides along too: staged here, installed below.
# MKDAT.PAS rides along as SOURCE, not as a build target: it is the tool that
# builds NEUROSIS.DAT, not part of the demo, and [order] must go on meaning
# "the demo" because the ten artefacts are measured from what it produces.
# MKDAT.BAT compiles it at the DOS prompt when somebody needs it.
alongside = ["src/asm/*.ASM", "src/asm/*.INC", "src/dos/*.BAT",
             "src/dos/*.PAS"]

[stage.subdirs]
GEN = "src/gen"

[install]
# The external harness. RUNPART.BAT checks NEUROSIS.DAT is present and runs
# NEURn.EXE -- the job the generated Pascal harness used to do from INSIDE the
# part, which cost two segments the original does not have and put the runtime
# on the wrong paragraph. A batch rather than a launcher program because DOS
# Exec would stay resident while the part runs, and these parts want the memory.
alongside = ["*.BAT"]

# Reconstruction source -> 8.3 DOS name, unit identifier before and after. The
# unit name inside a file is independent of the filename, but TP7 finds a unit
# BY FILENAME, so `uses Part3Sprites` must become `uses P3Sprite`.
