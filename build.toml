# How this target is built. Read by kit/tools/pascal/build.py, which holds the
# method; everything here is this demo's own data.
#
# GENERATED from tools/dosbox/dosbuild.py on 23 Aug 2026 by parsing it, not by
# transcribing it -- forty name rows copied by hand is how a config drifts from
# the script it replaces on its first day.
#
# NO MACHINE PATHS. The DOSBox-X executable, the drive C: image and the
# compiler's own location live in kit.local.toml, which git ignores.

src     = "src"
build   = "build"
title   = "psycho build"
drive   = "D"
# RELATIVE, and every path below is. The generated autoexec mounts the staging
# directory, changes to it and calls BUILD.BAT from there, so the batch's
# working directory IS this drive's root -- and build.py writes both files, so
# they cannot disagree. The batch already depended on that: `del *.TPU` at the
# top is relative, so a drive letter elsewhere bought nothing. build.py also
# throws the prefix away to find this file on the host --
# `log.split("\\")[-1]` -- so the one consumer of it never wanted it.
#
# The reason to remove it is that `drive` above and six paths here were six
# copies of one fact: set drive = "E" and the mount would move while these
# still said D:. MEASURED before changing, with a scratch config: exit 0, all
# ten targets byte-identical, 102 products, 34 installed, selftest passing.
log     = "BUILD.LOG"
timeout = 180
lint    = "kit/tools/pascal/paslint.py"

[compiler]
# No `binpath` here: the kit derives the DOS bin directory from
# `toolchain.<entry>` in kit.local.toml, which is where a machine path
# belongs -- and where a rename actually gets corrected.
#
# THE VALUES THIS FILE USED TO CARRY WERE RIGHT, and that is why the
# derivation could be trusted: all four matched the answers file, and
# deriving reproduced all four exactly. The sibling consumer's fifteen were
# stale -- the leftovers of the TP6/TP600 rename, in the one place that
# compiles nothing, since every invocation BUILD.BAT writes is fully
# qualified. A duplicate that cannot fail is a duplicate nobody corrects.
# TP 7.00, NOT 7.01, AND IT IS MEASURED. The two installs are told apart by
# TURBO.TPL, which the Borland patch notes size at 48,432 for 7.00 and 48,464
# for 7.01: C:\TP700 is the former and C:\TP the latter. Building against 7.00
# makes the runtime's coprocessor block match the original byte for byte --
# DS-relative $2FFA onward, where 7.01 inserts PUSH SP / POP DX / CMP DX,SP /
# JNE, an 8086 check the 1994 binaries do not carry. Part 005 goes to 11,440 of
# 11,440 with NO unaligned byte at all, part 001 to 21,257 and part 006 to
# 10,124, and all three byte-identical artefacts still hold.
#
# The size identifies the VERSION and NOT the patch state -- an in-place patch
# need not change it -- so "unpatched" is not claimed here. What is claimed is
# 7.00 over 7.01, and that is what the bytes say.
default = "tp700"

# THE ENTRY NAMES MIRROR THE INSTALL DIRECTORIES -- tp600, tp601, tp700, tp701
# against C:\TP600, C:\TP601, C:\TP700, C:\TP701 -- because "tp7" meaning 7.01
# while "tp700" meant 7.00 was a trap waiting to be fallen into. The `dialect`
# values below are NOT these names: they stay tp6 and tp7, because a dialect
# selects a source transform and there are only two of those.
#
# THE TP6 ENTRIES CARRY NO /U, DELIBERATELY: each of those installs' own
# BIN\TPC.CFG holds its unit path, and that is where it belongs. The rename left
# those files pointing at the old directories -- TP600's at C:\TP6, TP601's at
# C:\TP61 -- and the maintainer is correcting them at the source rather than
# having this file work around them.
[compiler.tp701]
# 7.01. KEPT FOR COMPARISON, NOT FOR BUILDING: its runtime carries the 8086
# check described above and its System block does not match the original's.
# The switch line is tp700's, with only the unit path changed; the notes that
# explain it live there, on the entry that actually builds the demo.
dialect  = "tp7"
switches = "/EBIN /UBIN;.;C:\\TP701\\UNITS /I.;GEN;ASM /OBIN /$S- /GD"

[compiler.tp700]
# THE ONE THE DEMO IS BUILT WITH. See the [compiler] note above for the
# evidence that it is 7.00 and not 7.01.
dialect = "tp7"
# /E<dir>  where the .EXE goes         /U<dirs> where to LOOK for units
# /I<dirs> where {$I} includes live    /$S-     STACK CHECKING OFF
#
# /$S- is load-bearing and its absence does not fail. TP7 defaults stack
# checking ON, and with it on every framed procedure -- INCLUDING an
# `assembler` one -- opens with a seven-byte XOR AX,AX / CALLF before the body.
# The demo was built with it off. Leaving the default made every hand-
# transcribed routine differ from the binary in its opening bytes.
#
# There is no /D output switch: /D is conditional DEFINES, and giving it a path
# is what produced "Error 130: Error in initial conditional defines".
#
# No /$E-, deliberately. The _fpu originals carry raw 9B+ESC where TP7 emits
# CD 3x emulator interrupts, but that is a POST-BUILD PATCH rather than a
# compile option, and dropping $E risks an unhandled INT 34h on any path the
# RTL does not patch.
# /GD MAKES TPC WRITE A MAP, AND IT ANSWERS WHAT WE HAD BEEN INFERRING. Every
# layout hunt here read our own code and data addresses out of the disassembly
# -- which is how one of them mis-decoded a runtime call operand as an `rcr`
# instruction, and another produced four contradictory shift deltas from a
# single build. The compiler knows the answers. /GD writes build/*.MAP with
# every segment's start, stop and length and every public symbol's address:
# P1Star's routines come out at 02C7:0000, 00C0 and 00F1, which are the
# original's 12b2 offsets exactly.
#
# It does NOT change the EXE -- all 32 targets and all seven walks are
# identical with it on -- and build/ is git-ignored, so the maps cost nothing.
# CODE publics only, not unit variables, so a data hunt works from segment
# LENGTHS rather than symbol names.
switches = "/EBIN /UBIN;.;C:\\TP700\\UNITS /I.;GEN;ASM /OBIN /$S- /GD"

[compiler.tp600]
# For SETTLING a compiler-version question, not for building the demo.
# TP6's install is FLAT: TPC.EXE sits in C:\TP600, not a BIN
# subdirectory, and its own TPC.CFG beside it carries the unit path.
dialect = "tp6"
switches = "/EBIN /UBIN;. /I.;GEN;ASM /OBIN /$S- /$X+ /$G+"

[compiler.tp601]
dialect = "tp6"
switches = "/EBIN /UBIN;. /I.;GEN;ASM /OBIN /$S- /$X+ /$G+"

[assembler]
# TP7's built-in assembler stops at the 286 ({$G+} is documented as "Generate
# 80286 Code Switch"), so the demo's 386 fixed-point maths comes in through
# {$L DEMOMATH.OBJ} and that object is assembled first. /ML keeps the PUBLIC
# names case-sensitive, which is how TPC matches them to Pascal identifiers.
flags = "/ML /Z"

[order]
# Derived from the staged sources' own `uses` clauses. A hardcoded dependency
# list gave "Error 15: File not found" the moment a part arrived that used
# something not on it, and NAMES order stopped being a build order the day
# NEUR0 (uses Detect) was added above DETECT.PAS.
mode = "uses"
list = [
  "test/VIDMODE.PAS",
  "test/LOADPART.PAS",
  "PSYCHO.PAS",
  "NEUR9.PAS",
  "NEUR0.PAS",
  "DETECT.PAS",
  "VGA.PAS",
  "DEMOVT.PAS",
  "MODEX.PAS",
  "FIXMATH.PAS",
  "P1LOGO.PAS",
  "P1TITLE.PAS",
  "P1MOSAIC.PAS",
  "P1STAR.PAS",
  "P1BALLS.PAS",
  "P1VECTOR.PAS",
  "NEUR1.PAS",
  "P2VIEW.PAS",
  "P2GARAGE.PAS",
  "P2SOLID.PAS",
  "NEUR2.PAS",
  "P3TUNNEL.PAS",
  "P3STARS.PAS",
  "P3MORPH.PAS",
  "P3GLOBE.PAS",
  "P3BLOCKS.PAS",
  "P3WAVES.PAS",
  "P3SPRITE.PAS",
  "NEUR3.PAS",
  "P4LEMS.PAS",
  "NEUR4.PAS",
  "P5MESH.PAS",
  "P5ROTO.PAS",
  "P5PATCH.PAS",
  "NEUR5.PAS",
  "P6WHOOSH.PAS",
  "P6TILES.PAS",
  "P6FIRE.PAS",
  "P6CREDIT.PAS",
  "NEUR6.PAS",
  "P7FLIC.PAS",
  "NEUR7.PAS",
]

[stage]
# Pascal sources here are 7-bit; anything else is a mistake worth seeing.
encoding = "ascii"
# The generated test harnesses already carry conforming 8.3 names and matching
# unit identifiers, so they map to themselves and adding one needs no edit here.
identity = ["test/TP*.PAS"]
# Only the DOS batch flattens into the build root now. The assembler modules and
# the shared Pascal includes arrive as a DIRECTORY instead -- see `verbatim` --
# so what the build was GIVEN and what it MADE are no longer in one heap.
alongside = ["src/dos/*.BAT"]

# src/asm copied as a folder, contents untouched. TASM is run from INSIDE it, so
# DEMOMATH.ASM's `INCLUDE COSTAB.INC` resolves against its own directory exactly
# as it did when these files were flattened into the root. The Pascal includes
# here -- BLITCLIP, SETPAL, SETRGB -- are reached through the compiler, so the
# switch lines below add D:\ASM to /I.
verbatim = ["src/asm"]

# Everything the build MAKES: .OBJ, .TPU, .MAP and .EXE. /E is TP's EXE AND TPU
# output directory, /O its object search path and /U its unit search path, so
# the products are written straight here and found here rather than being
# copied afterwards.
output = "BIN"

[stage.subdirs]
GEN = "src/gen"

[install]
# The external harness. RUNPART.BAT checks NEUROSIS.DAT is present and runs
# NEURn.EXE -- the job the generated Pascal harness used to do from INSIDE the
# part, which cost two segments the original does not have and put the runtime
# on the wrong paragraph. A batch rather than a launcher program because DOS
# Exec would stay resident while the part runs, and these parts want the memory.
# RUNPART.BAT BY NAME, not "*.BAT". The glob also installed the generated
# BUILD.BAT, which is the build's own scaffolding and has no business beside
# the demo -- and it went on installing MKDAT.BAT after that tool became
# Python, because run/ is not wiped between builds and nothing noticed.
alongside = ["RUNPART.BAT"]

# THE ORIGINALS' OWN NAMES. Turbo Pascal names its executable after the source
# and cannot be told otherwise, and `NEUROSIS.001` is not even an .EXE, so the
# rename happens on the way out of the build rather than in the source tree --
# the sources stay called what their units are called, which is what every
# other instrument reads them by.
#
# THIS INSTALLS THE LOAD IMAGE AND NOTHING ELSE, which is not yet the shipped
# file: each of parts 001-007 ships with a ProTracker module appended past its
# image, so bin/NEUROSIS.001 is 135,991 bytes where the image is 38,528.
# Appending it is a PACKAGING step with its own measurement, deliberately not
# folded in here -- see docs/04-neurosis-dat.md. Measured while deciding that:
# image + assets/partNNN/*.MOD is byte-identical to the shipped file for all
# seven parts that have one.
[install.as]
NEUR0   = "NEUROSIS.000"
NEUR1   = "NEUROSIS.001"
NEUR2   = "NEUROSIS.002"
NEUR3   = "NEUROSIS.003"
NEUR4   = "NEUROSIS.004"
NEUR5   = "NEUROSIS.005"
NEUR6   = "NEUROSIS.006"
NEUR7   = "NEUROSIS.007"
NEUR9   = "NEUROSIS.009"
# NEUROSIS.008 is absent on purpose: it is DemoVT, third-party, and this
# reconstruction does not build it.
TPSYCHO = "PSYCHO.EXE"

# Reconstruction source -> 8.3 DOS name, unit identifier before and after. The
# unit name inside a file is independent of the filename, but TP7 finds a unit
# BY FILENAME, so `uses P3Sprite` must become `uses P3Sprite`.
[names]
# A row is only needed when something has to CHANGE: a source whose 8.3 DOS name
# differs from its filename, or a unit identifier that has to be rewritten for
# TP7 to find the unit by file. build.py treats anything absent as identity, so a
# row saying "call NEUR1.PAS NEUR1.PAS and Neur1 Neur1" is config that looks like
# it does something and does not. There were 32 of those, left behind as each
# source took the name it compiles to; they are gone.
# VIDMODE lives in src/test/ but must stage FLAT. build.py resolves an
# [order] entry as `src / <key>` and names the staged copy after the KEY, so
# without this row it tries to write build/TEST/VIDMODE.PAS into a directory
# that does not exist. The row LOOKS like identity and is not -- it strips the
# subdirectory -- which is exactly what a "does this row do anything?" filter
# has to account for, and the one that pruned this table did not.
"test/VIDMODE.PAS" = ["VIDMODE.PAS", "VidMode", "VidMode"]
# LOADPART, same reason: it lives in src/test/ and must stage flat.
"test/LOADPART.PAS" = ["LOADPART.PAS", "LoadPart", "LoadPart"]
"PSYCHO.PAS" = ["TPSYCHO.PAS", "Psycho", "Psycho"]

# EXTRA DRIVES, so a session can reach what the build does not own. Paths are
# relative to this file's directory and are resolved when the config is written,
# so nothing here is a machine path.
#
# E: is the PACKAGED demo -- the parts as they shipped, with their music modules
# and a NEUROSIS.DAT built from the manifest. The build never writes there;
# tools/package.py does. So `E:` then `RUNPART 1` runs the real thing, while D:
# stays the staging directory and run/ stays the load images the checks measure.
[dosbox]
# The hand-tuned DOSBox-X config to overlay, and where to write the overlay.
# `build.py --interactive` writes MOUNTS.CFG and prints the command; the base
# file keeps its few hundred settings and NOT ONE machine path, which is the
# whole reason the two are separate files.
base_conf = "tools/dosbox/interactive.conf"
overlay   = "tools/dosbox/MOUNTS.CFG"
land      = "E"

# What the prompt says once the drives are there. Text only -- every path in it
# is a DOS path the overlay has just created.
banner = [
  "",
  "C: the compilers - TP701, TP700, TP601, TP600, and TASM",
  "D: build - the staging directory, and BIN holds what it made",
  "E: dist  - the packaged demo: parts with their music, and NEUROSIS.DAT",
  "R: run   - the load images, the 22 scene harnesses, and NEUROSIS.DAT",
  "",
  "PSYCHO        the launcher, as it shipped",
  "RUNPART n     one part, n = 1 to 7",
  "LOADPART f    run a file DOS will not start by name",
  "R: then TP1S1 one scene on its own",
  "",
]

[dosbox.mount]
E = "dist"
R = "run"
