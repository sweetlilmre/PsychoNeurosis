# The toolkit is the installable unit, not the repo. A pyproject.toml at the
# repo root would declare that all of Psycho Neurosis is a Python package,
# which it is not -- the repo is mostly 1994 binaries, Pascal sources and notes.
#
# Decided in issue #9 (the tooling boundary) and issue #6 (where things live).

[project]
name = "pascal-re-toolkit"
version = "0.1.0"
description = "Reverse-engineering tools for 16-bit DOS binaries built with Borland Pascal"
requires-python = ">=3.11"

# pyyaml reads the wiki's OKF frontmatter. Issue #8 argued for a real parser
# rather than a regex over text, and the reason is on the record: a line-based
# regex in tools/encaudit.py "reported 32 sites of which 16 were artifacts
# while missing 4 real ones", and only an AST parse was right. There is no
# reason to expect a hand-rolled frontmatter reader to do better.
#
# Config files are TOML and need NOTHING here: tomllib is in the standard
# library from 3.11, and the toolkit only ever reads config, never writes it.
# That is why requires-python is 3.11 rather than something older.
dependencies = [
    "pyyaml>=6.0",
]

# THE PACKAGES ARE DECLARED, not discovered. setuptools refuses to guess at a
# flat layout holding more than one top-level package -- it answers "Multiple
# top-level packages discovered in a flat-layout: ['pascal', 'substrate',
# 'wikitools']" and stops -- so for as long as this file said nothing, the
# documented editable install FAILED and nobody noticed, because every
# documented command runs a script by path. Found on 23 Aug 2026 while charting
# the kit; the history is in issue #39.
#
# Declaring them keeps the three folders exactly where they are. The two
# layouts that would satisfy setuptools by CONVENTION -- src-layout, or one
# top-level package with the tiers beneath it -- both move every file and
# deepen every documented command, and the three-folder shape is issue #9's
# decision, not this file's to overturn.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package root is this directory, so `substrate`, `pascal` and `wikitools`
# import under their own names -- which is what every script here already does
# and what `from substrate import align` in another repository would do.
package-dir = {"" = "."}
packages = ["substrate", "pascal", "wikitools"]
# Two modules sit beside the tiers rather than inside one: `project` is read by
# all three, and `census` spans them.
py-modules = ["census", "project"]

# NO console entry points, deliberately. `python kit/tools/pascal/plan.py` works
# with nothing installed, which is how a session that has just cloned a project
# starts; an entry point would require an install before the first command.

[tool.uv]
# Install into a virtual environment, never globally:
#     uv venv .venv
#     uv pip install --python .venv/Scripts/python.exe -e kit/tools
